<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title data-i18n="settings.pageTitle">SwitchBot Settings</title>
	<link rel="stylesheet" type="text/css" href="lwsa.css">
	<link rel="stylesheet" type="text/css" href="busy_indicator.css" />
	<link rel="stylesheet" type="text/css" href="settings.css" />

	<!-- The '/homey.js' script must be included in your settings view to work -->
	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<script type="text/javascript" src="busy_indicator.js"></script>
</head>

<body>
	<!-- Busy indicator -->
	<div id="busybox" class="fog_div">
		<div></div>
	</div>

	<!-- Device mode switch -->
	<div class="mode-switch">
		<label for="modeHub"><input type="radio" name="deviceMode" id="modeHub" value="hub" checked title="settings.modeHub" aria-label="settings.modeHub" /> <span data-i18n="settings.modeHub"></span></label>
		<label for="modeBLE"><input type="radio" name="deviceMode" id="modeBLE" value="ble" title="settings.modeBLE" aria-label="settings.modeBLE" /> <span data-i18n="settings.modeBLE"></span></label>
	</div>

	<!-- Tab links -->
	<div class="tab">
		<button class="tablinks" onclick="setPage(event, 'appSettings')" id="appSettingsTab" data-mode="hub" data-i18n="settings.tabAppSettings" title="settings.tabAppSettings"></button>
		<button class="tablinks" onclick="setPage(event, 'statistics')" id="statisticsTab" data-mode="ble" data-i18n="settings.tabStatistics" title="settings.tabStatistics"></button>
		<button class="tablinks" onclick="setPage(event, 'detected')" id="defaultOpen" data-mode="hub" data-i18n="settings.tabDetected" title="settings.tabDetected"></button>
		<button class="tablinks" onclick="setPage(event, 'bleDevices')" id="bleDevicesTab" data-mode="ble" data-i18n="settings.tabBLEDevices" title="settings.tabBLEDevices"></button>
		<button class="tablinks" onclick="setPage(event, 'bleSettings')" id="bleSettingsTab" data-mode="ble" data-i18n="settings.tabBLESettings" title="settings.tabBLESettings"></button>
		<button class="tablinks" onclick="setPage(event, 'log')" id="logTab" data-mode="both" data-i18n="settings.tabLog" title="settings.tabLog"></button>
		<button class="tablinks" onclick="setPage(event, 'status')" id="deviceStatusTab" data-mode="hub" data-i18n="settings.tabGetStatus" title="settings.tabGetStatus"></button>
		<button class="tablinks" onclick="setPage(event, 'oldSettings')" id="oldSettingsTab" data-mode="hub" data-i18n="settings.tabOldSettings" title="settings.tabOldSettings"></button>
		<button class="tablinks" onclick="setPage(event, 'driverSupport')" id="driverSupportTab" data-mode="both" data-i18n="settings.tabDriverSupport" title="settings.tabDriverSupport"></button>
		<button class="tablinks sim-log-tab-hidden" onclick="setPage(event, 'simulator')" id="simLogTab" data-mode="both" data-i18n="settings.tabSimulationData" title="settings.tabSimulationData"></button>
	</div>

	<div id="globalAuthWarning" class="auth-warning-banner" role="alert" aria-live="polite">
		<strong data-i18n="settings.oauthMissingSessionTitle" title="settings.oauthMissingSessionTitle"></strong>
		<span data-i18n="settings.oauthMissingSessionText" title="settings.oauthMissingSessionText"></span>
		<div class="auth-warning-actions">
			<button id="globalAuthLogin" class="homey-button-small" data-i18n="settings.loginWithSwitchBot" title="settings.loginWithSwitchBot"></button>
			<button id="globalAuthLegacy" class="homey-button-small" data-i18n="settings.tabOldSettings" title="settings.tabOldSettings"></button>
		</div>
	</div>

	<!--APP SETTINGS PAGE -->
	<div id="appSettings" class="tabcontent">
		<fieldset>
			<div class="field row">
				<label class="homey-form-label" for="numConnections"><span data-i18n="settings.numConnections"></span></label>
				<input class="homey-form-input" id="numConnections" type="number" min="1" value="1" title="settings.numConnections" aria-label="settings.numConnections" />
			</div>
			<p></p>
			<p>
				<button id="saveAppSettings" class="homey-button-small" data-i18n="settings.save" title="settings.save"></button>
			</p>
		</fieldset>
	</div>

	<!-- STATISTICS PAGE -->
	<div id="statistics" class="tabcontent">
		<fieldset>
			<div class="statistics-actions">
				<p data-i18n="settings.statisticsDescription"></p>
				<div>
					<button id="clearBLEStatistics" class="homey-button-small" type="button" data-i18n="settings.clearStatistics" title="settings.clearStatistics"></button>
					<button id="copyBLEStatistics" class="homey-button-small" type="button" data-i18n="settings.copyTable" title="settings.copyTable"></button>
				</div>
			</div>
			<div class="rssi-legend">
				<span data-i18n="settings.rssiLegendTitle"></span>
				<span class="rssi-legend-item rssi-poor"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendPoor"></span></span>
				<span class="rssi-legend-item rssi-low"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendLow"></span></span>
				<span class="rssi-legend-item rssi-ok"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendOk"></span></span>
				<span class="rssi-legend-item rssi-good"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendGood"></span></span>
			</div>
			<div class="statistics-scroll" style="padding: 0;">
				<table id="bleStatisticsTable">
					<colgroup>
						<col style="width: 15%;" />
						<col style="width: 15%;" />
						<col style="width: 15%;" />
						<col style="width: 7%;" />
						<col style="width: 7%;" />
						<col style="width: 9%;" />
						<col style="width: 7%;" />
						<col style="width: 7%;" />
						<col style="width: 6%;" />
						<col style="width: 13%;" />
					</colgroup>
					<thead>
						<tr>
							<th class="sortable" data-sort-key="name" data-i18n="settings.device"></th>
							<th class="sortable" data-sort-key="mac" data-i18n="settings.mac"></th>
							<th class="sortable" data-sort-key="driverType" data-i18n="settings.driver"></th>
							<th colspan="2" style="text-align:center;" data-i18n="settings.serviceData"></th>
							<th class="sortable" data-sort-key="advertisements" style="text-align:right;" data-i18n="settings.advertisements"></th>
							<th class="sortable" data-sort-key="polls" style="text-align:right;" data-i18n="settings.polled"></th>
							<th class="sortable" data-sort-key="errors" style="text-align:right;" data-i18n="settings.errors"></th>
							<th class="sortable" data-sort-key="rssi" style="text-align:right;" data-i18n="settings.rssi"></th>
							<th class="sortable" data-sort-key="lastSeenAt" data-i18n="settings.lastSeen"></th>
						</tr>
						<tr>
							<th></th>
							<th></th>
							<th></th>
							<th class="sortable" data-sort-key="missing" style="text-align:right;" data-i18n="settings.missing"></th>
							<th class="sortable" data-sort-key="present" style="text-align:right;" data-i18n="settings.present"></th>
							<th></th>
							<th></th>
							<th></th>
							<th style="text-align:right;" data-i18n="settings.dbm"></th>
							<th data-i18n="settings.elapsedTime"></th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</fieldset>
	</div>

	<!-- detected-->
	<div id="detected" class="tabcontent">
		<fieldset>
			<div id="bleOnlyNotice" class="auth-warning-banner" role="note">
				<span data-i18n="settings.bleOnlyDetectedNotice"></span>
				<div class="auth-warning-actions">
					<button id="goToStatisticsTab" class="homey-button-small" data-i18n="settings.tabBLEDevices" title="settings.tabBLEDevices"></button>
				</div>
			</div>
			<p class="detected-actions">
				<button id="getDeviceLog" class="homey-button-small" data-i18n="settings.getDevices" title="settings.getDevices"></button>
				<button id="clearDeviceLog" class="homey-button-small" data-i18n="settings.clear" title="settings.clear"></button>
				<button id="sendDeviceLog" class="homey-button-small" data-i18n="settings.send" title="settings.send"></button>
			</p>
			<div class="field row">
				<textarea id="detectedDevices" class="homey-form-textarea" wrap="off" title="settings.detectedDevices" aria-label="settings.detectedDevices"></textarea>
			</div>
		</fieldset>
	</div>

	<!-- BLE DEVICES PAGE -->
	<div id="bleDevices" class="tabcontent">
		<fieldset>
			<div class="statistics-actions">
				<p data-i18n="settings.bleDevicesDescription"></p>
				<div>
					<button id="scanForBLEDevices" class="homey-button-small" type="button" data-i18n="settings.scanForBLEDevices" title="settings.scanForBLEDevices"></button>
					<label for="recordAllBLEDevices"><input type="checkbox" id="recordAllBLEDevices" title="settings.recordAllBLEDevices" aria-label="settings.recordAllBLEDevices" /> <span data-i18n="settings.recordAllBLEDevices"></span></label>
				</div>
			</div>
			<div class="rssi-legend">
				<span data-i18n="settings.rssiLegendTitle"></span>
				<span class="rssi-legend-item rssi-poor"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendPoor"></span></span>
				<span class="rssi-legend-item rssi-low"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendLow"></span></span>
				<span class="rssi-legend-item rssi-ok"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendOk"></span></span>
				<span class="rssi-legend-item rssi-good"><span class="rssi-legend-swatch"></span><span data-i18n="settings.rssiLegendGood"></span></span>
			</div>
			<div class="statistics-scroll" style="padding: 0;">
				<table id="bleDetectedTable">
					<colgroup>
						<col style="width: 24%;" />
						<col style="width: 26%;" />
						<col style="width: 10%;" />
						<col style="width: 30%;" />
						<col style="width: 10%;" />
					</colgroup>
					<thead>
						<tr>
							<th class="sortable" data-sort-key="modelName" data-i18n="settings.bleDeviceModel"></th>
							<th class="sortable" data-sort-key="address" data-i18n="settings.mac"></th>
							<th class="sortable" data-sort-key="rssi" style="text-align:right;" data-i18n="settings.rssi"></th>
							<th class="sortable" data-sort-key="matchedDriverName" data-i18n="settings.bleDeviceMatchedDriver"></th>
							<th class="sortable" data-sort-key="isInstalled" style="text-align:right;" data-i18n="settings.bleDeviceInstalled"></th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>

			<div id="allBLEDevicesSection" class="all-ble-section">
				<div class="statistics-actions">
					<p data-i18n="settings.allBLEDevicesDescription"></p>
					<div>
						<button id="clearAllBLEDevices" class="homey-button-small" type="button" data-i18n="settings.clearRecordedDevices" title="settings.clearRecordedDevices"></button>
						<button id="copyAllBLEDevices" class="homey-button-small" type="button" data-i18n="settings.copyTable" title="settings.copyTable"></button>
					</div>
				</div>
				<div class="statistics-scroll">
					<table id="allBLEDevicesTable">
						<colgroup>
							<col style="width: 23%;" />
							<col style="width: 19%;" />
							<col style="width: 8%;" />
							<col style="width: 9%;" />
							<col style="width: 8%;" />
							<col style="width: 11%;" />
							<col style="width: 14%;" />
							<col style="width: 8%;" />
						</colgroup>
						<thead>
							<tr>
								<th class="sortable" data-sort-key="address" data-i18n="settings.mac"></th>
								<th class="sortable" data-sort-key="localName" data-i18n="settings.bleLocalName"></th>
								<th class="sortable" data-sort-key="rssi" style="text-align:right;" data-i18n="settings.rssi"></th>
								<th class="sortable" data-sort-key="isSwitchBot" data-i18n="settings.bleIsSwitchBot"></th>
								<th class="sortable" data-sort-key="isInstalled" data-i18n="settings.blePaired"></th>
								<th class="sortable" data-sort-key="subscribed" data-i18n="settings.bleSubscribed"></th>
								<th class="sortable" data-sort-key="reason" data-i18n="settings.bleRecordReason"></th>
								<th class="sortable" data-sort-key="seenCount" style="text-align:right;" data-i18n="settings.bleSeenCount"></th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
		</fieldset>
	</div>

	<!-- BLE SETTINGS PAGE -->
	<div id="bleSettings" class="tabcontent">
		<fieldset>
			<p data-i18n="settings.bleSettingsDescription"></p>
			<div class="field row">
				<label for="bleAdvertisementsEnabled">
					<input type="checkbox" id="bleAdvertisementsEnabled" title="settings.bleAdvertisementsEnabled" aria-label="settings.bleAdvertisementsEnabled" />
					<span data-i18n="settings.bleAdvertisementsEnabled"></span>
				</label>
			</div>
			<p class="ble-settings-hint" data-i18n="settings.bleAdvertisementsHint"></p>
			<p id="bleAdvertisementsStatus" class="ble-settings-status"></p>
		</fieldset>
	</div>

	<!-- LOG PAGE -->
	<div id="log" class="tabcontent">
		<fieldset>
			<p><span data-i18n="settings.diagnosticsLog"></span>
			</p>
			<div class="log-settings-bar">
				<div id="logSettingsSummary" class="log-settings-summary"></div>
				<button id="openLogSettings" class="homey-button-small" type="button" data-i18n="settings.logSettings" title="settings.logSettings"></button>
			</div>
			<p>
				<button id="clearInfoLog" class="homey-button-small" data-i18n="settings.clear" title="settings.clear"></button>
				<button id="sendInfoLog" class="homey-button-small" data-i18n="settings.send" title="settings.send"></button>
			</p>
			<div class="field row">
				<textarea id="infoLog" class="homey-form-textarea" wrap="off" title="settings.diagnosticsLog" aria-label="settings.diagnosticsLog"></textarea>
			</div>
		</fieldset>
		<div id="logSettingsModal" class="log-settings-modal" role="dialog" aria-modal="true" aria-labelledby="logSettingsTitle">
			<div class="log-settings-panel">
				<h2 id="logSettingsTitle" data-i18n="settings.logSettings"></h2>
				<div class="field row">
					<label class="homey-form-label" for="logLevel"><span data-i18n="settings.logLevel"></span></label>
					<select class="homey-form-select" id="logLevel" title="settings.logLevel" aria-label="settings.logLevel">
						<option value="0" data-i18n="settings.logErrorsOnly"></option>
						<option value="1" data-i18n="settings.logWebhookInfo"></option>
						<option value="2" data-i18n="settings.logBasicInfo"></option>
						<option value="3" data-i18n="settings.logDetailedInfo"></option>
						<option value="4" data-i18n="settings.logFullInfo"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-label" for="logSource"><span data-i18n="settings.logSource"></span></label>
					<select class="homey-form-select" id="logSource" title="settings.logSource" aria-label="settings.logSource">
						<option value="all" data-i18n="settings.logSourceAll"></option>
						<option value="ble" data-i18n="settings.logSourceBLE"></option>
						<option value="hub" data-i18n="settings.logSourceHub"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-label" for="logFilterType" data-i18n="settings.logFilterType"></label>
					<select class="homey-form-select" id="logFilterType" title="settings.logFilterType" aria-label="settings.logFilterType">
						<option value="none" data-i18n="settings.allData"></option>
						<option id="logFilterIdentifierOption" value="identifier" data-i18n="settings.bleMacDeviceId"></option>
						<option value="switchBotName" data-i18n="settings.switchBotDeviceName"></option>
						<option value="homeyName" data-i18n="settings.homeyDeviceName"></option>
						<option value="deviceType" data-i18n="settings.deviceType"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-label" id="logFilterValueLabel" for="logFilterValue" data-i18n="settings.logFilterValue"></label>
					<select class="log-filter-value-select" id="logFilterValue" title="settings.logFilterValue" aria-label="settings.logFilterValue" tabindex="-1"></select>
					<div class="log-filter-value-list" id="logFilterValueList" aria-labelledby="logFilterValueLabel"></div>
				</div>
				<div class="log-settings-actions">
					<button id="cancelLogSettings" class="homey-button-small" type="button" data-i18n="settings.cancel"></button>
					<button id="saveLogSettings" class="homey-button-small" type="button" data-i18n="settings.save"></button>
				</div>
			</div>
		</div>
	</div>

	<!--SEND COMMAND PAGE -->
	<div id="send" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<p><input id="commandData" type="text" value="" title="settings.commandData" aria-label="settings.commandData" /><button id="sendCmd"
					class="debug-send-button" data-i18n="settings.send" title="settings.send"></button><button

			<div class="field row">
				<textarea id="sendResponse" class="homey-form-textarea" wrap="off" title="settings.sendCommandResponse" aria-label="settings.sendCommandResponse"></textarea>
			</div>
		</fieldset>
	</div>

	<!--SIMULATION PAGE -->
	<div id="simulator" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<p><button id="useSim" class="homey-button-small" data-i18n="settings.activate" title="settings.activate"></button><button id="clearSim"
					class="debug-clear-button" data-i18n="settings.clearSim" title="settings.clearSim"></button></p>
			<div class="field row">
				<textarea id="simData" class="homey-form-textarea" wrap="off" title="settings.simulationData" aria-label="settings.simulationData"></textarea>
			</div>
		</fieldset>
	</div>

	<!--DEVICE GET STATUS PAGE -->
	<div id="status" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<div class="field row">
				<label class="homey-form-label" for="deviceID" data-i18n="settings.deviceId"></label>
				<input class="homey-form-input" id="deviceID" type="text" value="" title="settings.deviceId" aria-label="settings.deviceId" />
			</div>
			<p></p>
			<p>
				<button id="readStatus" class="homey-button-small" data-i18n="settings.readStatus" title="settings.readStatus"></button>
				<button id="clearStatusLog" class="homey-button-small" data-i18n="settings.clear" title="settings.clear"></button>
				<button id="sendStatusLog" class="homey-button-small" data-i18n="settings.send" title="settings.send"></button>
			</p>
			<div class="field row">
				<textarea id="statusData" class="homey-form-textarea" wrap="off" title="settings.deviceStatusLog" aria-label="settings.deviceStatusLog"></textarea>
			</div>
		</fieldset>
	</div>

	<!--OLD SETTINGS PAGE -->
	<div id="oldSettings" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<div class="field row">
				<label class="homey-form-label" for="openToken" data-i18n="settings.openToken"></label>
				<input class="homey-form-input" id="openToken" type="text" value="" title="settings.openToken" aria-label="settings.openToken" />
			</div>
			<div class="field row">
				<label class="homey-form-label" for="openSecret" data-i18n="settings.openSecret"></label>
				<input class="homey-form-input" id="openSecret" type="text" value="" title="settings.openSecret" aria-label="settings.openSecret" />
			</div>
			<p></p>
			<p>
				<button id="saveSettings" class="homey-button-small" data-i18n="settings.save" title="settings.save" disabled></button>
			</p>
		</fieldset>
	</div>

	<!-- DRIVER SUPPORT PAGE -->
	<div id="driverSupport" class="tabcontent">
		<div id="driverSupportSummary" class="driver-support-summary"></div>
		<div id="driverSupportView"></div>
	</div>

	<script type="text/javascript">
		// Create the busy indicator
		var busyi;
		busyi = new busy_indicator(document.getElementById("busybox"), document.querySelector("#busybox div"));

		var detectedDevicesElement = document.getElementById('detectedDevices');
		var infoLogElement = document.getElementById('infoLog');
		var logLevelElement = document.getElementById('logLevel');
		var logSourceElement = document.getElementById('logSource');
		var logFilterTypeElement = document.getElementById('logFilterType');
		var logFilterValueElement = document.getElementById('logFilterValue');
		var logFilterValueListElement = document.getElementById('logFilterValueList');
		var logSettingsSummaryElement = document.getElementById('logSettingsSummary');
		var logSettingsModalElement = document.getElementById('logSettingsModal');
		var openLogSettingsElement = document.getElementById('openLogSettings');
		var cancelLogSettingsElement = document.getElementById('cancelLogSettings');
		var saveLogSettingsElement = document.getElementById('saveLogSettings');
		var logFilterOptions = {};
		var clearInfoLogElement = document.getElementById('clearInfoLog');
		var sendInfoLogElement = document.getElementById('sendInfoLog');

		var getDeviceLogElement = document.getElementById('getDeviceLog');
		var clearDeviceLogElement = document.getElementById('clearDeviceLog');
		var sendDeviceLogElement = document.getElementById('sendDeviceLog');
		var bleOnlyNoticeElement = document.getElementById('bleOnlyNotice');
		var goToStatisticsTabElement = document.getElementById('goToStatisticsTab');
		var globalAuthWarningElement = document.getElementById('globalAuthWarning');
		var globalAuthLoginElement = document.getElementById('globalAuthLogin');
		var globalAuthLegacyElement = document.getElementById('globalAuthLegacy');
		var modeHubElement = document.getElementById('modeHub');
		var modeBLEElement = document.getElementById('modeBLE');
		var driverSupportSummaryElement = document.getElementById('driverSupportSummary');
		var driverSupportViewElement = document.getElementById('driverSupportView');
		var homeyInstance = null;
		var currentTabPage = 'detected';

		function translateSetting(key, fallback)
		{
			if (!homeyInstance)
			{
				return fallback;
			}
			const value = homeyInstance.__(key);
			return value === key ? fallback : value;
		}

		function escapeHtml(value)
		{
			return String(value === undefined || value === null ? '' : value)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		function renderDriverSupportError(message)
		{
			driverSupportSummaryElement.innerHTML = '';
			driverSupportViewElement.innerHTML = '';
			const section = document.createElement('section');
			section.className = 'driver-support-section';
			section.textContent = message;
			driverSupportViewElement.appendChild(section);
		}

		function createDriverSupportSection(title, items, className)
		{
			const section = document.createElement('section');
			section.className = `driver-support-section ${className}`;
			const heading = document.createElement('h3');

		function createDriverSupportIcon(driverId, iconPath)
		{
			const marker = '/settings/';
			const markerIndex = window.location.pathname.indexOf(marker);
			const appBasePath = markerIndex >= 0 ? window.location.pathname.substring(0, markerIndex) : '';
			const canonicalPath = `/drivers/${driverId}/assets/icon.svg`;
			const candidates = [
				iconPath,
				appBasePath ? `${appBasePath}${canonicalPath}` : '',
				`../drivers/${driverId}/assets/icon.svg`,
			].filter((candidate, index, paths) => candidate && paths.indexOf(candidate) === index);
			const icon = document.createElement('img');
			icon.className = 'driver-support-icon';
			icon.alt = '';
			let candidateIndex = 0;

			icon.onerror = function ()
			{
				if (candidateIndex >= candidates.length)
				{
					icon.style.visibility = 'hidden';
					return;
				}

				icon.src = candidates[candidateIndex];
				candidateIndex++;
			};
			icon.onerror();
			return icon;
		}

			Object.keys(groups).sort((left, right) => groups[left].name.localeCompare(groups[right].name)).forEach((key) => {
				const group = groups[key];
				const row = document.createElement('div');

		function renderDriverSupport(result)
		{
			if (!result)
			{
				renderDriverSupportError(translateSetting('settings.noData', 'No data'));
				return;
			}
			if (result.hasConnectedSession === false)
			{
				renderDriverSupportError(translateSetting('settings.driverSupportConnectLogin', 'Log in with your SwitchBot account before checking driver support.'));
				appendNotSupportableSection(Array.isArray(result.notSupportableDevices) ? result.notSupportableDevices : []);
				return;
			}

			driverSupportSummaryElement.innerHTML = '';
			driverSupportViewElement.innerHTML = '';
			[
				['driverSupportGenerated', 'Generated', result.generatedAt || '-'],
				['driverSupportDevices', 'SwitchBot devices', result.totalSwitchBotDevices || 0],
				['driverSupportDrivers', 'Matched drivers', result.totalMatchedDrivers || 0],
				['driverSupportNotAdded', 'Supported but not added', result.totalSupportedNotInstalled || 0],
				['driverSupportAdded', 'Supported and added', result.totalSupportedInstalled || 0],
				['driverSupportUnsupported', 'Unsupported', result.totalUnsupported || 0],
				['driverSupportNotSupportable', 'Not supportable', result.totalNotSupportable || 0],
			].forEach((summary) => {
				const chip = document.createElement('div');
				chip.className = 'driver-support-chip';
				chip.innerHTML = `<span class="driver-support-chip-label"></span><span class="driver-support-chip-value"></span>`;
				chip.firstChild.textContent = translateSetting(`settings.${summary[0]}`, summary[1]);
				chip.lastChild.textContent = summary[2];
				driverSupportSummaryElement.appendChild(chip);
			});

			const recommendations = Array.isArray(result.recommendations) ? result.recommendations : [];
			const supportedNotInstalled = recommendations.filter((item) => item.recommendedDriverId && !item.isInstalled);
			const supportedInstalled = recommendations.filter((item) => item.recommendedDriverId && item.isInstalled);
			const unsupported = recommendations.filter((item) => !item.recommendedDriverId);
			appendSupportedDriverSection(translateSetting('settings.driverSupportNotAdded', 'Supported but not added to Homey'), supportedNotInstalled, 'driver-support-not-installed');
			appendSupportedDriverSection(translateSetting('settings.driverSupportAdded', 'Supported and already added to Homey'), supportedInstalled, 'driver-support-installed');

			const unsupportedSection = createDriverSupportSection(translateSetting('settings.driverSupportUnsupportedDevices', 'Unsupported devices'), unsupported, 'driver-support-unsupported');
			const unsupportedList = document.createElement('ul');
			unsupportedList.className = 'driver-support-list';
			unsupported.forEach((device) => {
				const item = document.createElement('li');
				item.textContent = `${device.label} (${device.deviceType || translateSetting('settings.unknownType', 'Unknown type')})`;
				unsupportedList.appendChild(item);
			});
			unsupportedSection.appendChild(unsupportedList);
			if (unsupported.length > 0)
			{
				unsupportedSection.classList.add('driver-support-clickable');
				unsupportedSection.title = translateSetting('settings.driverSupportSendTitle', 'Click to send unsupported device information to the developer');
				unsupportedSection.addEventListener('click', function ()
				{
					Homey.confirm(translateSetting('settings.confirmSendUnsupported', 'Send information about these unsupported devices to the developer?'), null, function (err, confirmed)
					{
						if (err || !confirmed) return;
						waitCursor(true);
						Homey.api('POST', '/SendUnsupportedDevices/', { unsupportedDevices: unsupported }, function (apiErr)
						{
							waitCursor(false);
							Homey.alert(apiErr || translateSetting('settings.logSentSuccessfully', 'Log sent successfully'));
						});
					});
				});
			}
			driverSupportViewElement.appendChild(unsupportedSection);

			const notSupportableDevices = Array.isArray(result.notSupportableDevices) ? result.notSupportableDevices : [];
			appendNotSupportableSection(notSupportableDevices);
		}

			const sortedRows = allBLEDevicesRows
				.slice()
				.sort((left, right) => compareAllBLEDevicesRows(left, right, allBLEDevicesSort.key, allBLEDevicesSort.direction));

			const sanitize = (value) => escapeHtml(value);
			const spaceHex = (hex) => String(hex || '').replace(/(.{2})/g, '$1 ').trim();

			tbody.innerHTML = sortedRows.map((row) => {
				const address = sanitize(row.address);
				const localName = sanitize(row.localName) || '-';
				const rssiText = (typeof row.rssi === 'number' && Number.isFinite(row.rssi)) ? String(row.rssi) : '-';
				const rssiClass = getRSSIQualityClass(row.rssi);
				const switchBotText = row.isSwitchBot
					? translateSetting('settings.yes', 'Yes')
					: translateSetting('settings.no', 'No');
				const reasonText = sanitize(row.reason) || '-';
				const serviceParts = (Array.isArray(row.serviceData) ? row.serviceData : [])
					.map((entry) => `${sanitize(entry.uuid)}: ${spaceHex(sanitize(entry.data))}`)
					.join('<br />') || '-';
				const manufacturerText = spaceHex(sanitize(row.manufacturerData)) || '-';
				const modelText = row.modelName
					? `${sanitize(row.modelName)} (${sanitize(row.model)})`
					: '';
				const driverText = row.matchedDriverName ? sanitize(row.matchedDriverName) : '';
				const extraParts = [];
				if (modelText)
				{
					extraParts.push(`<span class="ble-raw-label">${translateSetting('settings.bleDeviceModel', 'Model')}:</span> ${modelText}`);
				}
				if (driverText)
				{
					extraParts.push(`<span class="ble-raw-label">${translateSetting('settings.bleDeviceMatchedDriver', 'Matched Driver')}:</span> ${driverText}`);
				}
				const extraText = extraParts.length ? `${extraParts.join(' &nbsp; ')}<br />` : '';
				const withCount = Number(row.withServiceDataCount || 0);
				const withoutCount = Number(row.withoutServiceDataCount || 0);
				const seenTitle = `${translateSetting('settings.bleServiceData', 'Service Data')}: ${withCount} / ${withCount + withoutCount}`;
				const pairedText = row.isInstalled
					? translateSetting('settings.yes', 'Yes')
					: translateSetting('settings.no', 'No');
				const subscribedText = row.subscribed
					? translateSetting('settings.yes', 'Yes')
					: translateSetting('settings.no', 'No');
				return `
					<tr class="${row.isSwitchBot ? '' : 'ble-not-switchbot'}">
						<td>${address}</td>
						<td>${localName}</td>
						<td class="${rssiClass}" style="text-align:right;">${rssiText}</td>
						<td>${switchBotText}</td>
						<td title="${sanitize(row.pairedName)}">${pairedText}</td>
						<td>${subscribedText}</td>

						<td class="ble-raw" colspan="8">

							<span class="ble-raw-label">${translateSetting('settings.bleManufacturerData', 'Manufacturer Data')}:</span> ${manufacturerText}
						</td>
					</tr>
				`;

		async function copyAllBLEDevicesToClipboard()
		{
			const header = ['MAC', 'Local name', 'RSSI', 'SwitchBot', 'Address type', 'Connectable', 'Service UUIDs', 'Service data', 'Manufacturer data', 'Model', 'Model name', 'Driver', 'Installed', 'Paired name', 'Subscribed', 'Reason', 'Seen count', 'With service data', 'Without service data', 'First seen', 'Last seen'];
			const lines = [header.join('\t')];
			for (const row of allBLEDevicesRows)
			{
				lines.push([
					row.address || '',
					row.localName || '',
					(typeof row.rssi === 'number' && Number.isFinite(row.rssi)) ? row.rssi : '',
					row.isSwitchBot ? 'yes' : 'no',
					row.addressType || '',
					row.connectable ? 'yes' : 'no',
					(Array.isArray(row.serviceUuids) ? row.serviceUuids.join(' ') : ''),
					getAllBLEDeviceServiceDataText(row),
					row.manufacturerData || '',
					row.model || '',
					row.modelName || '',
					row.matchedDriverName || '',
					row.isInstalled ? 'yes' : 'no',
					row.pairedName || '',
					row.subscribed ? 'yes' : 'no',
					row.reason || '',
					Number(row.seenCount || 0),
					Number(row.withServiceDataCount || 0),
					Number(row.withoutServiceDataCount || 0),
					row.firstSeenAt ? new Date(row.firstSeenAt).toISOString() : '',
					row.lastSeenAt ? new Date(row.lastSeenAt).toISOString() : '',
				].join('\t'));
			}

			const text = lines.join('\n');
			try
			{
				if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function')
				{
					await navigator.clipboard.writeText(text);
				}
				else
				{
					throw new Error('Clipboard API unavailable');
				}

				if (homeyInstance)
				{
					homeyInstance.alert(translateSetting('settings.recordedDevicesCopied', 'Recorded devices table copied to clipboard.'));
				}
			}
			catch (err)
			{
				const fallbackArea = document.createElement('textarea');
				fallbackArea.value = text;
				fallbackArea.setAttribute('readonly', 'readonly');
				fallbackArea.style.position = 'fixed';
				fallbackArea.style.top = '-1000px';
				document.body.appendChild(fallbackArea);
				fallbackArea.select();
				fallbackArea.setSelectionRange(0, fallbackArea.value.length);

				const copied = document.execCommand('copy');
				document.body.removeChild(fallbackArea);

				if (homeyInstance)
				{
					homeyInstance.alert(copied
						? translateSetting('settings.recordedDevicesCopied', 'Recorded devices table copied to clipboard.')
						: translateSetting('settings.statisticsCopyFailed', 'Could not copy automatically. Please select and copy the table manually.'));
				}
			}
		}

		function getRSSIQualityClass(rssi)
		{
			if (typeof rssi !== 'number' || !Number.isFinite(rssi))
			{
				return '';
			}
			if (rssi >= -60) return 'rssi-good';
			if (rssi >= -75) return 'rssi-ok';
			if (rssi >= -90) return 'rssi-low';
			return 'rssi-poor';
		}

		function renderBLEStatistics(rows)
		{
			const formatElapsedSince = (lastSeenAt) => {
				const timestamp = Number(lastSeenAt || 0);
				if (!timestamp)
				{
					return translateSetting('settings.never', 'Never');
				}

				const elapsedSeconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
				const hours = Math.floor(elapsedSeconds / 3600);
				const minutes = Math.floor((elapsedSeconds % 3600) / 60);
				const seconds = elapsedSeconds % 60;
				return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
			};

			const tbody = bleStatisticsTableElement && bleStatisticsTableElement.querySelector('tbody');
			if (!tbody)
			{
				return;
			}

			if (!Array.isArray(rows) || rows.length === 0)
			{
				tbody.innerHTML = `<tr><td colspan="10" style="padding:8px;">${translateSetting('settings.noBleDevices', 'No BLE devices registered.')}</td></tr>`;
				return;
			}

			const sortedRows = rows
				.slice()
				.sort((left, right) => compareBLEStatisticsRows(left, right, bleStatisticsSort.key, bleStatisticsSort.direction));

			tbody.innerHTML = sortedRows.map((row) => {
				const lastSeenText = formatElapsedSince(row.lastSeenAt);
				const rssiText = (typeof row.rssi === 'number' && Number.isFinite(row.rssi)) ? String(Math.round(row.rssi)) : '-';
				const rssiClass = getRSSIQualityClass(row.rssi);
				const macText = escapeHtml(row.mac);
				const macClass = row.viaBLEHub ? 'ble-hub-source' : '';
				const macTitle = row.viaBLEHub ? translateSetting('settings.bleHubSourceTitle', 'Relayed via ESP32 BLE Hub') : '';
				const driverText = escapeHtml(row.driverType);
				const naText = (value) => (row.viaBLEHub && !Number(value || 0)) ? '-' : String(Number(value || 0));
				const errorsCount = Number(row.errors || 0);
				const lastErrorText = row.lastError ? escapeHtml(row.lastError) : '';
				const errorCellClass = errorsCount > 0 ? 'ble-error-count' : '';
				const errorCellTitle = errorsCount > 0 ? translateSetting('settings.clickToViewError', 'Click to view last error') : '';
				return `
					<tr>
						<td style="padding:6px 8px;">${escapeHtml(row.name || translateSetting('settings.unknown', 'Unknown'))}</td>
						<td class="${macClass}" title="${macTitle}" style="padding:6px 8px;">${macText}</td>
						<td style="padding:6px 8px;">${driverText}</td>
						<td style="padding:6px 8px; text-align:right;">${naText(row.missing)}</td>
						<td style="padding:6px 8px; text-align:right;">${naText(row.present)}</td>
						<td style="padding:6px 8px; text-align:right;">${naText(row.advertisements)}</td>
						<td style="padding:6px 8px; text-align:right;">${naText(row.polls)}</td>
						<td class="${errorCellClass}" data-last-error="${lastErrorText}" title="${errorCellTitle}" style="padding:6px 8px; text-align:right;">${errorsCount > 0 ? errorsCount : naText(row.errors)}</td>
						<td class="${rssiClass}" style="padding:6px 8px; text-align:right;">${rssiText}</td>
						<td style="padding:6px 8px; text-align:left;">${lastSeenText}</td>
					</tr>
				`;
			}).join('');
		}

				if (err)
				{

		function renderDetectedBLEDevices(rows)
		{
			const tbody = bleDetectedTableElement && bleDetectedTableElement.querySelector('tbody');
			if (!tbody)
			{
				return;
			}

			bleDetectedDevicesRows = Array.isArray(rows) ? rows : [];

			if (bleDetectedDevicesRows.length === 0)
			{
				tbody.innerHTML = `<tr><td colspan="5" style="padding:8px;">${translateSetting('settings.noBLEDevicesDetected', 'No BLE devices detected yet. Click Scan Now to search.')}</td></tr>`;
				return;
			}

			const sortedRows = bleDetectedDevicesRows
				.slice()
				.sort((left, right) => compareDetectedBLEDevicesRows(left, right, bleDetectedDevicesSort.key, bleDetectedDevicesSort.direction));

			tbody.innerHTML = sortedRows.map((row) => {
				const modelName = escapeHtml(row.modelName || row.model || translateSetting('settings.unknown', 'Unknown'));
				const address = escapeHtml(row.address);
				const addressClass = row.viaBLEHub ? 'ble-hub-source' : '';
				const rssiText = (typeof row.rssi === 'number' && Number.isFinite(row.rssi)) ? String(row.rssi) : '-';
				const rssiClass = getRSSIQualityClass(row.rssi);
				const driverText = row.matchedDriverName
					? escapeHtml(row.matchedDriverName)
					: translateSetting('settings.bleDeviceUnsupported', 'Unsupported');

					? translateSetting('settings.yes', 'Yes')
					: translateSetting('settings.no', 'No');
				return `
					<tr>
						<td>${modelName}</td>
						<td class="${addressClass}" title="${row.viaBLEHub ? translateSetting('settings.bleHubSourceTitle', 'Relayed via ESP32 BLE Hub') : ''}">${address}</td>
						<td class="${rssiClass}" style="text-align:right;">${rssiText}</td>
						<td>${driverText}</td>
						<td style="text-align:right;">${installedText}</td>
					</tr>

		function renderDetectedBLEDevicesMessage(message)
		{
			const tbody = bleDetectedTableElement && bleDetectedTableElement.querySelector('tbody');
			if (tbody)
			{
				tbody.innerHTML = `<tr><td colspan="5" style="padding:8px;">${escapeHtml(message)}</td></tr>`;
			}

		function refreshDetectedBLEDevices()
		{
			if (scanForBLEDevicesElement)
			{
				scanForBLEDevicesElement.disabled = true;
				scanForBLEDevicesElement.textContent = translateSetting('settings.scanningBLEDevices', 'Scanning...');
			}

			Homey.api('GET', '/getDetectedBLEDevices/', {}, function (err, result)
			{
				if (scanForBLEDevicesElement)
				{
					scanForBLEDevicesElement.disabled = false;
					scanForBLEDevicesElement.textContent = translateSetting('settings.scanForBLEDevices', 'Scan Now');
				}

				if (err)
				{
					console.error('BLE device scan failed:', err);
					return;
				}

				// The API returns {initialising, devices}; older shapes returned a bare array.
				if (result && !Array.isArray(result) && result.initialising)
				{
					renderDetectedBLEDevicesMessage(translateSetting('settings.bleInitialising', 'Waiting for BLE to initialise...'));
					return;
				}

				const devices = Array.isArray(result) ? result : ((result && result.devices) || []);
				renderDetectedBLEDevices(devices);
				refreshAllBLEDevices();
			});
		}

		function updateLogFilterIdentifierLabel()
		{
			const identifierOption = document.getElementById('logFilterIdentifierOption');

			{
				identifierOption.textContent = translateSetting('settings.bleMac', 'BLE MAC');

		function populateLogFilterValues(selectedValue)
		{
			updateLogFilterIdentifierLabel();
			const filterType = logFilterTypeElement.value;
			const sourceOptions = logSourceElement.value !== 'all' && logFilterOptions.bySource
				? (logFilterOptions.bySource[logSourceElement.value] || {})
				: logFilterOptions;
			const values = filterType === 'none' ? [] : (sourceOptions[filterType] || []).map((entry) => (
				typeof entry === 'string' ? { value: entry, label: entry } : entry
			));
			logFilterValueElement.innerHTML = '';
			logFilterValueListElement.innerHTML = '';

			if (filterType === 'none')
			{
				const option = document.createElement('option');
				option.value = '';
				option.textContent = translateSetting('settings.allData', 'All data');
				logFilterValueElement.appendChild(option);
				logFilterValueElement.disabled = true;
				const message = document.createElement('div');
				message.className = 'log-filter-value-empty';
				message.textContent = option.textContent;
				logFilterValueListElement.appendChild(message);
				return;
			}

			logFilterValueElement.disabled = false;
			if (values.length === 0)
			{
				const option = document.createElement('option');
				option.value = '';
				option.textContent = translateSetting('settings.noMatchingDevices', 'No matching devices');
				logFilterValueElement.appendChild(option);
				logFilterValueElement.disabled = true;
				const message = document.createElement('div');
				message.className = 'log-filter-value-empty';
				message.textContent = option.textContent;
				logFilterValueListElement.appendChild(message);
				return;
			}

			for (const entry of values)
			{
				const option = document.createElement('option');
				option.value = entry.value;
				option.textContent = entry.label;
				option.dataset.driverId = entry.driverId || '';
				logFilterValueElement.appendChild(option);

				const item = document.createElement('button');
				item.className = 'log-filter-value-item';
				item.type = 'button';
				item.dataset.value = entry.value;
				item.setAttribute('aria-pressed', 'false');
				const icon = createDriverSupportIcon(String(entry.driverId || '').split(':').pop(), '');
				icon.className = 'log-filter-value-icon';
				const label = document.createElement('span');
				label.className = 'log-filter-value-label';
				label.textContent = entry.label;
				item.appendChild(icon);
				item.appendChild(label);
				item.addEventListener('click', function ()
				{
					logFilterValueElement.value = entry.value;
					for (const candidate of logFilterValueListElement.querySelectorAll('.log-filter-value-item'))
					{
						const isSelected = candidate.dataset.value === entry.value;
						candidate.classList.toggle('selected', isSelected);
						candidate.setAttribute('aria-pressed', String(isSelected));
					}
				});
				logFilterValueListElement.appendChild(item);
			}

			if (selectedValue && values.some((entry) => entry.value === selectedValue))
			{
				logFilterValueElement.value = selectedValue;
			}

			const selectedItem = Array.from(logFilterValueListElement.querySelectorAll('.log-filter-value-item'))
				.find((item) => item.dataset.value === logFilterValueElement.value);
			if (selectedItem)
			{
				selectedItem.classList.add('selected');
				selectedItem.setAttribute('aria-pressed', 'true');
			}
		}

		function updateLogSettingsSummary()
		{
			const filterSummary = logFilterTypeElement.value === 'none'
				? translateSetting('settings.allData', 'All data')
				: `${getSelectedText(logFilterTypeElement)}: ${getSelectedText(logFilterValueElement) || translateSetting('settings.noSelection', 'No selection')}`;
			const summaryText = document.createElement('div');
			summaryText.className = 'log-settings-summary-text';
			summaryText.textContent = [
				`${translateSetting('settings.level', 'Level')}: ${getSelectedText(logLevelElement)}`,
				`${translateSetting('settings.source', 'Source')}: ${getSelectedText(logSourceElement)}`,
				`${translateSetting('settings.filter', 'Filter')}: ${filterSummary}`,
			].join('\n');

			logSettingsSummaryElement.innerHTML = '';
			const selectedOption = logFilterValueElement.options[logFilterValueElement.selectedIndex];
			const driverId = logFilterTypeElement.value !== 'none' && selectedOption
				? String(selectedOption.dataset.driverId || '').split(':').pop()
				: '';
			logSettingsSummaryElement.classList.toggle('no-icon', !driverId);
			if (driverId)
			{
				const icon = createDriverSupportIcon(driverId, '');
				icon.className = 'log-settings-summary-icon';
				logSettingsSummaryElement.appendChild(icon);
			}
			logSettingsSummaryElement.appendChild(summaryText);
		}

		function loadLogSettings(callback)
		{
			Homey.api('GET', '/getLogFilterOptions/', {}, function (optionsErr, options)
			{
				if (optionsErr)
				{
					Homey.alert(optionsErr);
					return;
				}
				logFilterOptions = options || {};

				Homey.get('logLevel', function (levelErr, logLevel)
				{
					if (levelErr) return Homey.alert(levelErr);
					logLevelElement.value = String(logLevel === null ? 0 : logLevel);
					Homey.get('logSource', function (sourceErr, logSource)
					{
						if (sourceErr) return Homey.alert(sourceErr);
						logSourceElement.value = logSource || 'all';
						Homey.get('logFilterType', function (typeErr, filterType)
						{
							if (typeErr) return Homey.alert(typeErr);
							logFilterTypeElement.value = filterType || 'none';
							Homey.get('logFilterValue', function (valueErr, filterValue)
							{
								if (valueErr) return Homey.alert(valueErr);
								populateLogFilterValues(filterValue || '');
								updateLogSettingsSummary();
								if (callback) callback();
							});
						});
					});
				});
			});
		}

		function closeLogSettings()
		{
			logSettingsModalElement.classList.remove('open');
			openLogSettingsElement.focus();
		}

		function saveLogSettings()
		{
			if (logFilterTypeElement.value !== 'none' && !logFilterValueElement.value)
			{
				Homey.alert(translateSetting('settings.selectFilterInformation', 'Select filter information before saving.'));
				return;
			}

			const settings = [
				['logLevel', parseInt(logLevelElement.value)],
				['logSource', logSourceElement.value],
				['logFilterType', logFilterTypeElement.value],
				['logFilterValue', logFilterTypeElement.value === 'none' ? '' : logFilterValueElement.value],
			];
			let pending = settings.length;
			for (const [key, value] of settings)
			{
				Homey.set(key, value, function (err)
				{
					if (err)
					{
						Homey.alert(err);
						return;
					}
					pending--;
					if (pending === 0)
					{
						updateLogSettingsSummary();
						closeLogSettings();
					}
				});
			}
		}

		// a method named 'onHomeyReady' must be present in your code
		function onHomeyReady(Homey)
		{
			homeyInstance = Homey;
			const t = (key, fallback) => {
				const value = Homey.__(key);
				return value === key ? fallback : value;
			};

			const localizeA11yPlaceholders = () => {
				document.querySelectorAll('[title^="settings."]').forEach((element) => {
					const key = element.getAttribute('title');
					element.setAttribute('title', t(key, key));
				});

				document.querySelectorAll('[aria-label^="settings."]').forEach((element) => {
					const key = element.getAttribute('aria-label');
					element.setAttribute('aria-label', t(key, key));
				});
			};

			// Tell Homey we're ready to be displayed
			Homey.ready();
			initializeBLEStatisticsSorting();
			initializeDetectedBLEDevicesSorting();
			initializeAllBLEDevicesSorting();

			// Ensure placeholder accessibility labels are localized at runtime.
			localizeA11yPlaceholders();

			// Check OAuth status
			checkOAuthStatus(Homey);

			Homey.get('debugMode', function (err, debugMode)
			{
				if (err) return Homey.alert(err);
				document.getElementById('simLogTab').classList.toggle('sim-log-tab-debug', debugMode === true);
			});

			modeHubElement.addEventListener('change', function ()
			{
				if (modeHubElement.checked)
				{
					Homey.set('deviceMode', 'hub');
					applyDeviceModeVisibility('hub');
					applyGlobalAuthWarningVisibility(currentTabPage);
					if (currentTabPage === 'driverSupport')
					{
						refreshDriverSupport();
					}
				}
			});

			modeBLEElement.addEventListener('change', function ()
			{
				if (modeBLEElement.checked)
				{
					Homey.set('deviceMode', 'ble');
					applyDeviceModeVisibility('ble');
					applyGlobalAuthWarningVisibility(currentTabPage);
					if (currentTabPage === 'driverSupport')
					{
						refreshDriverSupport();
					}
				}
			});

			Homey.get('deviceMode', function (err, deviceMode)
			{
				const mode = (!err && deviceMode === 'ble') ? 'ble' : 'hub';
				(mode === 'ble' ? modeBLEElement : modeHubElement).checked = true;
				document.getElementById(mode === 'ble' ? 'bleDevicesTab' : 'defaultOpen').click();
				applyDeviceModeVisibility(mode);
			});
			refreshBLEStatistics();
			if (bleStatisticsRefreshTimer)
			{
				clearInterval(bleStatisticsRefreshTimer);
			}
			bleStatisticsRefreshTimer = setInterval(refreshBLEStatistics, 10000);

			if (copyBLEStatisticsElement)
			{
				copyBLEStatisticsElement.addEventListener('click', function ()
				{
					copyBLEStatisticsToClipboard();
				});
			}

			if (clearBLEStatisticsElement)
			{
				clearBLEStatisticsElement.addEventListener('click', function ()
				{
					clearBLEStatistics();
				});
			}

			if (scanForBLEDevicesElement)
			{
				scanForBLEDevicesElement.addEventListener('click', function ()
				{
					refreshDetectedBLEDevices();
				});
			}

			if (recordAllBLEDevicesElement)
			{
				Homey.get('recordAllBLEDevices', function (err, recordAll)
				{
					if (!err)
					{
						recordAllBLEDevicesElement.checked = Boolean(recordAll);
					}

					setAllBLEDevicesVisibility();
				});

				recordAllBLEDevicesElement.addEventListener('change', function ()
				{
					Homey.set('recordAllBLEDevices', recordAllBLEDevicesElement.checked, function (err)
					{
						if (err)
						{
							Homey.alert(err);
						}
					});

					setAllBLEDevicesVisibility();
				});
			}

			if (copyAllBLEDevicesElement)
			{
				copyAllBLEDevicesElement.addEventListener('click', function ()
				{
					copyAllBLEDevicesToClipboard();
				});
			}

			if (bleAdvertisementsEnabledElement)
			{
				bleAdvertisementsEnabledElement.addEventListener('change', function ()
				{
					// The app subscribes/unsubscribes every registered BLE device when this changes.
					bleAdvertisementsEnabledElement.disabled = true;
					Homey.set('bleAdvertisementsEnabled', bleAdvertisementsEnabledElement.checked, function (err)
					{
						if (err)
						{
							Homey.alert(err);
						}

						setTimeout(refreshBLEAdvertisementSettings, 1500);
					});
				});
			}

			if (clearAllBLEDevicesElement)
			{
				clearAllBLEDevicesElement.addEventListener('click', function ()
				{
					Homey.api('POST', '/clearAllDetectedBLEDevices/', {}, function (err)
					{
						if (err)
						{
							Homey.alert(err);
							return;
						}

						renderAllBLEDevices([]);
					});
				});
			}

			Homey.api('GET', '/getLog/',
				{
					notify: true
				}, function (err, result)
			{
				if (err)
				{
					Homey.alert(err);
				}
				else
				{
					infoLogElement.value = result;
				}
			});

			Homey.on('com.switchbot.logupdated', function (data)
			{
				infoLogElement.value = data.log;
			});

			Homey.on('com.switchbot.detectedDevicesUpdated', function (data)
			{
				detectedDevicesElement.value = data.devices;
			});

			// Pushed by the app's background BLE discovery so the list stays current without polling.
			Homey.on('com.switchbot.bleDevicesUpdated', function (data)
			{
				if (data && Array.isArray(data.devices))
				{
					renderDetectedBLEDevices(data.devices);
					refreshAllBLEDevices();
				}
			});

			loadLogSettings();

			Homey.get('numConnections', function (err, numConnections)
			{
				if (err) return Homey.alert(err);
				numConnectionsElement.value = numConnections;
			});

			logFilterTypeElement.addEventListener('change', function ()
			{
				populateLogFilterValues('');
			});

			logSourceElement.addEventListener('change', function ()
			{
				populateLogFilterValues(logFilterValueElement.value);
			});

			openLogSettingsElement.addEventListener('click', function ()
			{
				loadLogSettings(function ()
				{
					logSettingsModalElement.classList.add('open');
					logLevelElement.focus();
				});
			});

			cancelLogSettingsElement.addEventListener('click', closeLogSettings);
			saveLogSettingsElement.addEventListener('click', saveLogSettings);
			logSettingsModalElement.addEventListener('click', function (event)
			{
				if (event.target === logSettingsModalElement)
				{
					closeLogSettings();
				}
			});
			document.addEventListener('keydown', function (event)
			{
				if (event.key === 'Escape' && logSettingsModalElement.classList.contains('open'))
				{
					closeLogSettings();
				}
			});

			globalAuthLoginElement.addEventListener('click', function ()
			{
				waitCursor(true);
				Homey.api('GET', '/startOAuth2Flow/', {}, function (err, result)
				{
					waitCursor(false);

					if (err || !result || !result.authUrl)
					{
						Homey.alert(t('settings.oauthLoginStartError', 'Error initiating login. Please try again. If this persists, check your OAuth2 client configuration.'));
						return;
					}

					// Use Homey.openURL to open the OAuth callback URL in the actual browser (outside settings webview)
					Homey.openURL(result.authUrl);

					// After user completes OAuth, check status periodically
					Homey.alert(t('settings.oauthLoginOpened', 'A browser window has opened with the SwitchBot login page. After login, return here. The Get HUB devices button will be available once authenticated.'));

					// Give user time to complete OAuth, then start checking
					setTimeout(() => {
						checkOAuthStatus(Homey);
					}, 3000);

					// Keep checking every 5 seconds for up to 5 minutes
					const maxAttempts = 60;
					let attempts = 0;
					const checkInterval = setInterval(() => {
						attempts++;
						if (attempts >= maxAttempts)
						{
							clearInterval(checkInterval);
							return;
						}
						checkOAuthStatus(Homey);
					}, 5000);
				});
			});

			globalAuthLegacyElement.addEventListener('click', function ()
			{
				modeHubElement.checked = true;
				Homey.set('deviceMode', 'hub');
				applyDeviceModeVisibility('hub');
				document.getElementById('oldSettingsTab').click();
			});

			goToStatisticsTabElement.addEventListener('click', function ()
			{
				modeBLEElement.checked = true;
				Homey.set('deviceMode', 'ble');
				applyDeviceModeVisibility('ble');
				document.getElementById('bleDevicesTab').click();
			});

			getDeviceLogElement.addEventListener('click', function (e)
			{
				// Check OAuth status first
				Homey.api('GET', '/checkOAuthStatus/', {}, function (err, result)
				{
					if (err || (result && !result.hasOAuthSession))
					{
						Homey.alert(t('settings.oauthLoginRequiredFirst', 'Please log in with your SwitchBot account first by clicking the Login with SwitchBot Account button.'));
						globalAuthWarningElement.style.display = 'block';
						return;
					}

					waitCursor(true);
					Homey.api('GET', '/getDetect/',
						{
							notify: true,
							hubDevices: true
						}, function (err, result)
					{
						if (err)
						{
							Homey.alert(err);
						}
						else
						{
							detectedDevicesElement.value = result;
						}
						waitCursor(false);
					});
				});
			});

			clearDeviceLogElement.addEventListener('click', function (e)
			{
				Homey.set('detectedDevices', "", function (err)
				{
					if (err) return Homey.alert(err);
				});
				detectedDevicesElement.value = "";
			});

			sendDeviceLogElement.addEventListener('click', function (e)
			{
				if (detectedDevicesElement.value.length < 15)
				{
					return Homey.alert(t('settings.noDataToSend', 'No Data to send'));
				}
				Homey.confirm(t('settings.confirmSendDeviceLog', 'Send the device log contents to the developer?'), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/SendDeviceLog/',
							{
								notify: true
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert(t('settings.logSentSuccessfully', 'Log sent successfully'));
							}
							waitCursor(false);
						});
					}
				});
			});

			sendInfoLogElement.addEventListener('click', function (e)
			{
				if (infoLogElement.value.length < 15)
				{
					return Homey.alert(t('settings.noDataToSend', 'No Data to send'));
				}

				Homey.confirm(t('settings.confirmSendInfoLog', 'Send the information log contents to the developer?'), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/sendInfoLog/',
							{
								notify: true
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert(t('settings.logSentSuccessfully', 'Log sent successfully'));
							}
							waitCursor(false);
						});
					}
				});
			});

			clearInfoLogElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/clearLog/',
					{
						notify: true
					}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						infoLogElement.value = "";
					}
				});
			});

			useSimElement.addEventListener('click', function (e)
			{
				try
				{
					Homey.set('simData', simDataElement.value, function (err)
					{
						if (err)
						{
							Homey.alert(err);
						}
						else
						{
							Homey.alert(t('settings.simulatorOn', 'Simulator On'));
						}
					});
				}
				catch (err)
				{
					return Homey.alert(err);
				}
			});

			clearSimElement.addEventListener('click', function (e)
			{
				Homey.set('simData', "", function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						return Homey.alert(t('settings.simulatorOff', 'Simulator Off'));
					}
				});
			});

			readStatusElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/requestDeviceStatus/?deviceId=' + deviceIDElement.value, {}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						statusDataElement.value = result;
					}
				});
			});

			clearStatusLogElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/clearStatusLog/',
					{
						notify: true
					}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						statusDataElement.value = "";
					}
				});
			});

			sendStatusLogElement.addEventListener('click', function (e)
			{
				if (statusDataElement.value.length < 15)
				{
					return Homey.alert(t('settings.noDataToSend', 'No Data to send'));
				}

				Homey.confirm(t('settings.confirmSendStatusLog', 'Send the status log contents to the developer?'), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/sendStatusLog/',
							{
								notify: true
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert(t('settings.logSentSuccessfully', 'Log sent successfully'));
							}
							waitCursor(false);
						});
					}
				});
			});

			saveSettingsElement.addEventListener('click', function (e)
			{
				if (!oldSettingsFieldsLoaded)
				{
					return;
				}

				Homey.set('openToken', openTokenIDElement.value, function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
				});

				Homey.set('openSecret', openSecretElement.value, function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
				});

				setTimeout(function ()
				{
					checkOAuthStatus(Homey);
				}, 100);
			});

			saveAppSettingsElement.addEventListener('click', function (e)
			{
				Homey.set('numConnections', parseInt(numConnectionsElement.value), function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
				});
			});
		}

		function setPage(evt, tabPage)
		{
			var i, tabcontent, tablinks;

			currentTabPage = tabPage;

			// Decide the banner's visibility from the cached auth state before the tab is drawn, so it never flashes
			applyGlobalAuthWarningVisibility(tabPage);

			// Get all elements with class="tabcontent" and hide them
			tabcontent = document.getElementsByClassName("tabcontent");
			for (i = 0; i < tabcontent.length; i++)
			{
				tabcontent[i].style.display = "none";
			}

			// Get all elements with class="tablinks" and remove the class "active"
			tablinks = document.getElementsByClassName("tablinks");
			for (i = 0; i < tablinks.length; i++)
			{
				tablinks[i].className = tablinks[i].className.replace(" active", "");
			}

			// Show the current tab, and add an "active" class to the button that opened the tab
			document.getElementById(tabPage).style.display = "block";
			evt.currentTarget.className += " active";

			if (tabPage == 'log')
			{
				loadLogSettings();

				// Make the log text area fill the page
				infoLogElement.style.width = infoLogElement.parentElement.clientWidth + 'px';
				infoLogElement.style.height = (window.innerHeight - infoLogElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'detected')
			{
				// Make the detected devices text area fill the page
				detectedDevicesElement.setAttribute('cols', detectedDevicesElement.parentElement.clientWidth / 8);
				detectedDevicesElement.style.height = (window.innerHeight - detectedDevicesElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'simulator')
			{
				Homey.get('simData', function (err, simData)
				{
					if (err) return Homey.alert(err);
					simDataElement.value = simData ? simData : "";
				});
				// Make the simulator text box fill the page
				simDataElement.setAttribute('cols', simDataElement.parentElement.clientWidth / 8);
				simDataElement.style.height = (window.innerHeight - simDataElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'status')
			{
				// Make the detected devices text area fill the page
				statusDataElement.style.width = (deviceIDElement.offsetWidth) + 'px';
				statusDataElement.style.height = (window.innerHeight - statusDataElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'oldSettings')
			{
				oldSettingsFieldsLoaded = false;
				oldSettingsTokenLoaded = false;
				oldSettingsSecretLoaded = false;
				openTokenIDElement.value = '';
				openSecretElement.value = '';
				saveSettingsElement.disabled = true;

				Homey.get('openToken', function (err, openToken)
				{
					if (err) return Homey.alert(err);
					openTokenIDElement.value = openToken || '';
					oldSettingsTokenLoaded = true;
					if (oldSettingsSecretLoaded)
					{
						oldSettingsFieldsLoaded = true;
						saveSettingsElement.disabled = false;
					}
				});

				Homey.get('openSecret', function (err, openSecret)
				{
					if (err) return Homey.alert(err);
					openSecretElement.value = openSecret || '';
					oldSettingsSecretLoaded = true;
					if (oldSettingsTokenLoaded)
					{
						oldSettingsFieldsLoaded = true;
						saveSettingsElement.disabled = false;
					}
				});
			}
			else if (tabPage == 'appSettings')
			{
				Homey.get('numConnections', function (err, numConnections)
				{
					if (err) return Homey.alert(err);
					numConnectionsElement.value = numConnections;
				});
			}
			else if (tabPage == 'statistics')
			{
				refreshBLEStatistics();
			}
			else if (tabPage == 'bleDevices')
			{
				refreshDetectedBLEDevices();
			}
			else if (tabPage == 'bleSettings')
			{
				refreshBLEAdvertisementSettings();
			}
			else if (tabPage == 'driverSupport')
			{
				refreshDriverSupport();
			}

			if (homeyInstance)
			{
				checkOAuthStatus(homeyInstance);
			}
		}

		function waitCursor(On)
		{
			if (On)
			{
				busyi.show();
			}
			else
			{
				busyi.hide();
			}
		}
	</script>
