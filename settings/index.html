<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title data-i18n="settings.pageTitle">SwitchBot Settings</title>
	<link rel="stylesheet" type="text/css" href="lwsa.css">
	<link rel="stylesheet" type="text/css" href="busy_indicator.css" />

	<style type="text/css">
		.fog_div {
			display: none;
			position: fixed;
			top: 0px;
			left: 0px;
			height: 100%;
			width: 100%;
			z-index: 100;
			background-color: rgba(30, 30, 30, 0.5);
		}

		.sim-log-tab-hidden {
			display: none !important;
		}

		.sim-log-tab-debug {
			display: block !important;
		}

			#statistics {
				height: calc(100vh - 110px);
				min-height: 280px;
				width: 100%;
				max-width: 100%;
				box-sizing: border-box;
			}

			#statistics fieldset {
				display: flex;
				flex-direction: column;
				height: calc(100% - 10px);
				overflow: hidden;
				min-height: 0;
				min-width: 0;
				max-width: 100%;
				box-sizing: border-box;
				margin: 0;
			}

			#statistics .statistics-scroll {
				flex: 1 1 auto;
				overflow-x: auto;
				overflow-y: auto;
				height: calc(100% - 24px);
				max-height: calc(100% - 24px);
				min-height: 340px;
				border: 1px solid rgba(0,0,0,0.12);
				border-radius: 4px;
				display: block;
				position: relative;
				scrollbar-gutter: stable;
				min-width: 0;
				max-width: 100%;
				scrollbar-width: auto;
				box-sizing: border-box;
				align-self: stretch;
			}

			#statistics .statistics-scroll::-webkit-scrollbar {
				width: 15px;
				height: 15px;
			}

			#statistics .statistics-scroll::-webkit-scrollbar-thumb {
				background-color: rgba(74, 110, 155, 0.45);
				border-radius: 8px;
			}

			#statistics .statistics-scroll::-webkit-scrollbar-track {
				background: rgba(0, 0, 0, 0.05);
			}

			#bleStatisticsTable {
				border-collapse: collapse;
				font-size: 70%;
				table-layout: fixed;
				width: 700px;
				min-width: 700px;
			}

			#bleStatisticsTable thead {
				position: sticky;
				top: 0;
				z-index: 3;
			}

			#bleStatisticsTable thead th {
				background: #edf2f8;
				z-index: 3;
				text-align: left;
				border-bottom: 1px solid rgba(0,0,0,0.12);
				padding: 6px 8px;
			}

			#bleStatisticsTable thead th.sortable {
				cursor: pointer;
				-webkit-user-select: none;
				user-select: none;
			}

			#bleStatisticsTable thead tr:nth-child(2) th {
				border-top: 1px solid rgba(0,0,0,0.12);
			}

			#bleStatisticsTable thead tr:nth-child(2) th:nth-child(9) {
				white-space: nowrap;
			}

			#bleStatisticsTable td {
				padding: 6px 8px;
				background: white;
				border-bottom: 1px solid rgba(0,0,0,0.08);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			#bleStatisticsTable td:nth-child(4) {
				text-align: right;
			}

			#bleStatisticsTable td:nth-child(9) {
				overflow: visible;
				text-overflow: clip;
			}

			#bleStatisticsTable td:nth-child(4),
			#bleStatisticsTable td:nth-child(5),
			#bleStatisticsTable td:nth-child(6),
			#bleStatisticsTable td:nth-child(7),
			#bleStatisticsTable td:nth-child(8) {
				text-align: right;
			}

		.oauth-login-button {
			display: none;
			background-color: #0066cc;
		}

		.debug-send-button {
			background-color: #0f9e16;
			color: #ffffff;
			margin: 5px 20px 5px 5px;
		}

		.debug-clear-button {
			background-color: #a5510d;
			color: #ffffff;
			margin: 5px 20px 5px 5px;
		}

		.detected-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
		}

		.auth-warning-banner {
			display: none;
			margin: 12px 0;
			padding: 10px 12px;
			border-radius: 6px;
			border: 1px solid #f0ad4e;
			background-color: #fff7e6;
			color: #8a5a00;
		}

		.auth-warning-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin-top: 8px;
		}

		.statistics-actions {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 8px;
			margin: 0 0 8px 0;
		}

		.statistics-actions p {
			margin: 0;
			white-space: nowrap;
		}

		.statistics-actions > div {
			display: flex;
			gap: 8px;
		}

		#bleStatisticsTable,
		#bleStatisticsTable th,
		#bleStatisticsTable td {
			-webkit-user-select: text;
			user-select: text;
		}

		.log-settings-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 8px 0 12px;
			padding: 10px 12px;
			border: 1px solid rgba(0, 0, 0, 0.12);
			border-radius: 6px;
			background: #f7f8fa;
		}

		.log-settings-summary {
			min-width: 0;
			font-size: 90%;
			line-height: 1.5;
			white-space: pre-line;
		}

		#openLogSettings {
			flex: 0 0 auto;
			min-width: 112px;
			padding: 8px 14px;
			white-space: nowrap;
		}

		.log-settings-modal {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 200;
			align-items: center;
			justify-content: center;
			padding: 20px;
			background: rgba(30, 30, 30, 0.55);
		}

		.log-settings-modal.open {
			display: flex;
		}

		.log-settings-panel {
			width: min(480px, 100%);
			max-height: calc(100vh - 40px);
			overflow-y: auto;
			box-sizing: border-box;
			padding: 20px;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
		}

		.log-settings-panel h2 {
			margin: 0 0 16px;
			font-size: 20px;
		}

		.log-settings-actions {
			display: flex;
			justify-content: flex-end;
			gap: 8px;
			margin-top: 18px;
		}

		#driverSupport {
			height: calc(100vh - 102px);
			overflow-y: auto;
			box-sizing: border-box;
		}

		.driver-support-summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			gap: 8px;
			margin-bottom: 12px;
		}

		.driver-support-chip,
		.driver-support-section {
			border: 1px solid #dce1e8;
			border-radius: 6px;
			background: #ffffff;
		}

		.driver-support-chip {
			padding: 9px 10px;
		}

		.driver-support-chip-label {
			display: block;
			font-size: 12px;
			color: #5f6673;
		}

		.driver-support-chip-value {
			display: block;
			margin-top: 3px;
			font-size: 17px;
			font-weight: 700;
		}

		.driver-support-section {
			margin-bottom: 10px;
			padding: 10px;
			border-left-width: 4px;
		}

		.driver-support-not-installed { border-left-color: #d18400; background: #fff9ef; }
		.driver-support-installed { border-left-color: #1d8f4d; background: #f3fbf6; }
		.driver-support-unsupported { border-left-color: #768195; background: #f7f9fc; }
		.driver-support-not-supportable { border-left-color: #a54646; background: #fff6f6; }
		.driver-support-clickable { cursor: pointer; }

		.driver-support-section h3 {
			display: flex;
			justify-content: space-between;
			gap: 8px;
			margin: 0 0 8px;
			font-size: 15px;
		}

		.driver-support-group {
			display: grid;
			grid-template-columns: 48px 1fr;
			gap: 10px;
			padding-top: 8px;
			margin-top: 8px;
			border-top: 1px solid rgba(0, 0, 0, 0.08);
		}

		.driver-support-icon {
			width: 48px;
			height: 48px;
			object-fit: contain;
		}

		.driver-support-group strong { font-size: 14px; }
		.driver-support-list { margin: 5px 0 0; padding-left: 18px; }
		.driver-support-list li { margin: 2px 0; font-size: 13px; }
	</style>

	<!-- The '/homey.js' script must be included in your settings view to work -->
	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<script type="text/javascript" src="busy_indicator.js"></script>
</head>

<body>
	<!-- Busy indicator -->
	<div id="busybox" class="fog_div">
		<div></div>
	</div>

	<!-- Tab links -->
	<div class="tab">
		<button class="tablinks" onclick="setPage(event, 'appSettings')" id="appSettingsTab" data-i18n="settings.tabAppSettings" title="settings.tabAppSettings"></button>
		<button class="tablinks" onclick="setPage(event, 'statistics')" id="statisticsTab" data-i18n="settings.tabStatistics" title="settings.tabStatistics"></button>
		<button class="tablinks" onclick="setPage(event, 'detected')" id="defaultOpen" data-i18n="settings.tabDetected" title="settings.tabDetected"></button>
		<button class="tablinks" onclick="setPage(event, 'log')" data-i18n="settings.tabLog" title="settings.tabLog"></button>
		<button class="tablinks" onclick="setPage(event, 'status')" id="deviceStatusTab" data-i18n="settings.tabGetStatus" title="settings.tabGetStatus"></button>
		<button class="tablinks" onclick="setPage(event, 'oldSettings')" id="oldSettingsTab" data-i18n="settings.tabOldSettings" title="settings.tabOldSettings"></button>
		<button class="tablinks" onclick="setPage(event, 'driverSupport')" id="driverSupportTab" data-i18n="settings.tabDriverSupport" title="settings.tabDriverSupport"></button>
		<button class="tablinks sim-log-tab-hidden" onclick="setPage(event, 'simulator')" id="simLogTab" data-i18n="settings.tabSimulationData" title="settings.tabSimulationData"></button>
	</div>

	<div id="globalAuthWarning" class="auth-warning-banner" role="alert" aria-live="polite">
		<strong data-i18n="settings.oauthMissingSessionTitle" title="settings.oauthMissingSessionTitle"></strong>
		<span data-i18n="settings.oauthMissingSessionText" title="settings.oauthMissingSessionText"></span>
		<div class="auth-warning-actions">
			<button id="globalAuthLogin" class="homey-button-small" data-i18n="settings.loginWithSwitchBot" title="settings.loginWithSwitchBot"></button>
			<button id="globalAuthLegacy" class="homey-button-small" data-i18n="settings.tabOldSettings" title="settings.tabOldSettings"></button>
		</div>
	</div>

	<!--APP SETTINGS PAGE -->
	<div id="appSettings" class="tabcontent">
		<fieldset>
			<div class="field row">
				<label class="homey-form-label" for="numConnections"><span data-i18n="settings.numConnections"></span></label>
				<input class="homey-form-input" id="numConnections" type="number" min="1" value="1" title="settings.numConnections" aria-label="settings.numConnections" />
			</div>
			<p></p>
			<p>
				<button id="saveAppSettings" class="homey-button-small" data-i18n="settings.save" title="settings.save"></button>
			</p>
		</fieldset>
	</div>

	<!-- STATISTICS PAGE -->
	<div id="statistics" class="tabcontent">
		<fieldset>
			<div class="statistics-actions">
				<p data-i18n="settings.statisticsDescription"></p>
				<div>
					<button id="clearBLEStatistics" class="homey-button-small" type="button" data-i18n="settings.clearStatistics" title="settings.clearStatistics"></button>
					<button id="copyBLEStatistics" class="homey-button-small" type="button" data-i18n="settings.copyTable" title="settings.copyTable"></button>
				</div>
			</div>
			<div class="statistics-scroll" style="padding: 0;">
				<table id="bleStatisticsTable">
					<colgroup>
						<col style="width: 17%;" />
						<col style="width: 15%;" />
						<col style="width: 15%;" />
						<col style="width: 8%;" />
						<col style="width: 8%;" />
						<col style="width: 10%;" />
						<col style="width: 8%;" />
						<col style="width: 6%;" />
						<col style="width: 12%;" />
					</colgroup>
					<thead>
						<tr>
							<th class="sortable" data-sort-key="name" data-i18n="settings.device"></th>
							<th class="sortable" data-sort-key="mac" data-i18n="settings.mac"></th>
							<th class="sortable" data-sort-key="driverType" data-i18n="settings.driver"></th>
							<th colspan="2" style="text-align:center;" data-i18n="settings.serviceData"></th>
							<th class="sortable" data-sort-key="advertisements" style="text-align:right;" data-i18n="settings.advertisements"></th>
							<th class="sortable" data-sort-key="polls" style="text-align:right;" data-i18n="settings.polled"></th>
							<th class="sortable" data-sort-key="rssi" style="text-align:right;" data-i18n="settings.rssi"></th>
							<th class="sortable" data-sort-key="lastSeenAt" data-i18n="settings.lastSeen"></th>
						</tr>
						<tr>
							<th></th>
							<th></th>
							<th></th>
							<th class="sortable" data-sort-key="missing" style="text-align:right;" data-i18n="settings.missing"></th>
							<th class="sortable" data-sort-key="present" style="text-align:right;" data-i18n="settings.present"></th>
							<th></th>
							<th></th>
							<th style="text-align:right;" data-i18n="settings.dbm"></th>
							<th data-i18n="settings.elapsedTime"></th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</fieldset>
	</div>

	<!-- detected-->
	<div id="detected" class="tabcontent">
		<fieldset>
			<p id="oAuthStatusMessage" class="oauth-status-message">
				<strong data-i18n="settings.oauthMissingSessionTitle"></strong> <span data-i18n="settings.oauthMissingSessionText"></span>
			</p>
			<p class="detected-actions">
				<button id="loginWithOAuth" class="homey-button-small oauth-login-button" data-i18n="settings.loginWithSwitchBot" title="settings.loginWithSwitchBot"></button>
				<button id="getDeviceLog" class="homey-button-small" data-i18n="settings.getDevices" title="settings.getDevices"></button>
				<button id="clearDeviceLog" class="homey-button-small" data-i18n="settings.clear" title="settings.clear"></button>
				<button id="sendDeviceLog" class="homey-button-small" data-i18n="settings.send" title="settings.send"></button>
			</p>
			<div class="field row">
				<textarea id="detectedDevices" class="homey-form-textarea" wrap="off" title="settings.detectedDevices" aria-label="settings.detectedDevices"></textarea>
			</div>
		</fieldset>
	</div>

	<!-- LOG PAGE -->
	<div id="log" class="tabcontent">
		<fieldset>
			<p><span data-i18n="settings.diagnosticsLog"></span>
			</p>
			<div class="log-settings-bar">
				<div id="logSettingsSummary" class="log-settings-summary"></div>
				<button id="openLogSettings" class="homey-button-small" type="button" data-i18n="settings.logSettings" title="settings.logSettings"></button>
			</div>
			<p>
				<button id="clearInfoLog" class="homey-button-small" data-i18n="settings.clear" title="settings.clear"></button>
				<button id="sendInfoLog" class="homey-button-small" data-i18n="settings.send" title="settings.send"></button>
			</p>
			<div class="field row">
				<textarea id="infoLog" class="homey-form-textarea" wrap="off" title="settings.diagnosticsLog" aria-label="settings.diagnosticsLog"></textarea>
			</div>
		</fieldset>
		<div id="logSettingsModal" class="log-settings-modal" role="dialog" aria-modal="true" aria-labelledby="logSettingsTitle">
			<div class="log-settings-panel">
				<h2 id="logSettingsTitle" data-i18n="settings.logSettings"></h2>
				<div class="field row">
					<label class="homey-form-label" for="logLevel"><span data-i18n="settings.logLevel"></span></label>
					<select class="homey-form-select" id="logLevel" title="settings.logLevel" aria-label="settings.logLevel">
						<option value="0" data-i18n="settings.logErrorsOnly"></option>
						<option value="1" data-i18n="settings.logWebhookInfo"></option>
						<option value="2" data-i18n="settings.logBasicInfo"></option>
						<option value="3" data-i18n="settings.logDetailedInfo"></option>
						<option value="4" data-i18n="settings.logFullInfo"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-label" for="logSource"><span data-i18n="settings.logSource"></span></label>
					<select class="homey-form-select" id="logSource" title="settings.logSource" aria-label="settings.logSource">
						<option value="all" data-i18n="settings.logSourceAll"></option>
						<option value="ble" data-i18n="settings.logSourceBLE"></option>
						<option value="hub" data-i18n="settings.logSourceHub"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-label" for="logFilterType" data-i18n="settings.logFilterType"></label>
					<select class="homey-form-select" id="logFilterType" title="settings.logFilterType" aria-label="settings.logFilterType">
						<option value="none" data-i18n="settings.allData"></option>
						<option id="logFilterIdentifierOption" value="identifier" data-i18n="settings.bleMacDeviceId"></option>
						<option value="switchBotName" data-i18n="settings.switchBotDeviceName"></option>
						<option value="homeyName" data-i18n="settings.homeyDeviceName"></option>
						<option value="deviceType" data-i18n="settings.deviceType"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-label" for="logFilterValue" data-i18n="settings.logFilterValue"></label>
					<select class="homey-form-select" id="logFilterValue" title="settings.logFilterValue" aria-label="settings.logFilterValue"></select>
				</div>
				<div class="log-settings-actions">
					<button id="cancelLogSettings" class="homey-button-small" type="button" data-i18n="settings.cancel"></button>
					<button id="saveLogSettings" class="homey-button-small" type="button" data-i18n="settings.save"></button>
				</div>
			</div>
		</div>
	</div>

	<!--SEND COMMAND PAGE -->
	<div id="send" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<p><input id="commandData" type="text" value="" title="settings.commandData" aria-label="settings.commandData" /><button id="sendCmd"
					class="debug-send-button" data-i18n="settings.send" title="settings.send"></button><button
					id="clearSend" class="debug-clear-button" data-i18n="settings.clear" title="settings.clear"></button></p>
			<div class="field row">
				<textarea id="sendResponse" class="homey-form-textarea" wrap="off" title="settings.sendCommandResponse" aria-label="settings.sendCommandResponse"></textarea>
			</div>
		</fieldset>
	</div>

	<!--SIMULATION PAGE -->
	<div id="simulator" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<p><button id="useSim" class="homey-button-small" data-i18n="settings.activate" title="settings.activate"></button><button id="clearSim"
					class="debug-clear-button" data-i18n="settings.clearSim" title="settings.clearSim"></button></p>
			<div class="field row">
				<textarea id="simData" class="homey-form-textarea" wrap="off" title="settings.simulationData" aria-label="settings.simulationData"></textarea>
			</div>
		</fieldset>
	</div>

	<!--DEVICE GET STATUS PAGE -->
	<div id="status" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<div class="field row">
				<label class="homey-form-label" for="deviceID" data-i18n="settings.deviceId"></label>
				<input class="homey-form-input" id="deviceID" type="text" value="" title="settings.deviceId" aria-label="settings.deviceId" />
			</div>
			<p></p>
			<p>
				<button id="readStatus" class="homey-button-small" data-i18n="settings.readStatus" title="settings.readStatus"></button>
				<button id="clearStatusLog" class="homey-button-small" data-i18n="settings.clear" title="settings.clear"></button>
				<button id="sendStatusLog" class="homey-button-small" data-i18n="settings.send" title="settings.send"></button>
			</p>
			<div class="field row">
				<textarea id="statusData" class="homey-form-textarea" wrap="off" title="settings.deviceStatusLog" aria-label="settings.deviceStatusLog"></textarea>
			</div>
		</fieldset>
	</div>

	<!--OLD SETTINGS PAGE -->
	<div id="oldSettings" class="tabcontent">
		<fieldset>
			<h1 data-i18n="settings.forDebugUseOnly"></h1>
			<div class="field row">
				<label class="homey-form-label" for="openToken" data-i18n="settings.openToken"></label>
				<input class="homey-form-input" id="openToken" type="text" value="" title="settings.openToken" aria-label="settings.openToken" />
			</div>
			<div class="field row">
				<label class="homey-form-label" for="openSecret" data-i18n="settings.openSecret"></label>
				<input class="homey-form-input" id="openSecret" type="text" value="" title="settings.openSecret" aria-label="settings.openSecret" />
			</div>
			<p></p>
			<p>
				<button id="saveSettings" class="homey-button-small" data-i18n="settings.save" title="settings.save"></button>
			</p>
		</fieldset>
	</div>

	<!-- DRIVER SUPPORT PAGE -->
	<div id="driverSupport" class="tabcontent">
		<div id="driverSupportSummary" class="driver-support-summary"></div>
		<div id="driverSupportView"></div>
	</div>

	<script type="text/javascript">
		// Create the busy indicator
		var busyi;
		busyi = new busy_indicator(document.getElementById("busybox"), document.querySelector("#busybox div"));

		var detectedDevicesElement = document.getElementById('detectedDevices');
		var infoLogElement = document.getElementById('infoLog');
		var logLevelElement = document.getElementById('logLevel');
		var logSourceElement = document.getElementById('logSource');
		var logFilterTypeElement = document.getElementById('logFilterType');
		var logFilterValueElement = document.getElementById('logFilterValue');
		var logSettingsSummaryElement = document.getElementById('logSettingsSummary');

		function createDriverSupportIcon(driverId, iconPath)
		{
			const marker = '/settings/';
			const markerIndex = window.location.pathname.indexOf(marker);
			const appBasePath = markerIndex >= 0 ? window.location.pathname.substring(0, markerIndex) : '';
			const canonicalPath = `/drivers/${driverId}/assets/icon.svg`;
			const candidates = [
				iconPath,
				appBasePath ? `${appBasePath}${canonicalPath}` : '',
				`../drivers/${driverId}/assets/icon.svg`,
			].filter((candidate, index, paths) => candidate && paths.indexOf(candidate) === index);
			const icon = document.createElement('img');
			icon.className = 'driver-support-icon';
			icon.alt = '';
			let candidateIndex = 0;

			icon.onerror = function ()
			{
				if (candidateIndex >= candidates.length)
				{
					icon.style.visibility = 'hidden';
					return;
				}

				icon.src = candidates[candidateIndex];
				candidateIndex++;
			};
			icon.onerror();
			return icon;
		}

		function appendSupportedDriverSection(title, items, className)
		{
			const section = createDriverSupportSection(title, items, className);
			const groups = {};
			items.forEach((item) => {
				const key = item.recommendedDriverId;
				if (!groups[key])
				{
					groups[key] = { name: item.recommendedDriverName || key, icon: item.recommendedDriverIcon, devices: [] };
				}
				groups[key].devices.push(item.label);
			});

			Object.keys(groups).sort((left, right) => groups[left].name.localeCompare(groups[right].name)).forEach((key) => {
				const group = groups[key];
				const row = document.createElement('div');
				row.className = 'driver-support-group';
				const icon = createDriverSupportIcon(key, group.icon);
				const content = document.createElement('div');
				const name = document.createElement('strong');
				name.textContent = group.name;
				const list = document.createElement('ul');
				list.className = 'driver-support-list';
				group.devices.sort().forEach((deviceName) => {
					const item = document.createElement('li');
					item.textContent = deviceName;
					list.appendChild(item);
				});
				content.appendChild(name);
				content.appendChild(list);
				row.appendChild(icon);
				row.appendChild(content);
				section.appendChild(row);
			});

			if (items.length === 0)
			{
				section.appendChild(document.createTextNode(translateSetting('settings.none', 'None')));
			}
			driverSupportViewElement.appendChild(section);
		}

		function renderDriverSupport(result)
		{
			if (!result)
			{
				renderDriverSupportError(translateSetting('settings.noData', 'No data'));
				return;
			}
			if (result.hasConnectedSession === false)
			{
				renderDriverSupportError(translateSetting('settings.driverSupportConnectLogin', 'Log in with your SwitchBot account before checking driver support.'));
				appendNotSupportableSection(Array.isArray(result.notSupportableDevices) ? result.notSupportableDevices : []);
				return;
			}

			driverSupportSummaryElement.innerHTML = '';
			driverSupportViewElement.innerHTML = '';
			[
				['driverSupportGenerated', 'Generated', result.generatedAt || '-'],
				['driverSupportDevices', 'SwitchBot devices', result.totalSwitchBotDevices || 0],
				['driverSupportDrivers', 'Matched drivers', result.totalMatchedDrivers || 0],
				['driverSupportNotAdded', 'Supported but not added', result.totalSupportedNotInstalled || 0],
				['driverSupportAdded', 'Supported and added', result.totalSupportedInstalled || 0],
				['driverSupportUnsupported', 'Unsupported', result.totalUnsupported || 0],
				['driverSupportNotSupportable', 'Not supportable', result.totalNotSupportable || 0],
			].forEach((summary) => {
				const chip = document.createElement('div');
				chip.className = 'driver-support-chip';
				chip.innerHTML = `<span class="driver-support-chip-label"></span><span class="driver-support-chip-value"></span>`;
				chip.firstChild.textContent = translateSetting(`settings.${summary[0]}`, summary[1]);
				chip.lastChild.textContent = summary[2];
				driverSupportSummaryElement.appendChild(chip);
			});

			const recommendations = Array.isArray(result.recommendations) ? result.recommendations : [];
			const supportedNotInstalled = recommendations.filter((item) => item.recommendedDriverId && !item.isInstalled);
			const supportedInstalled = recommendations.filter((item) => item.recommendedDriverId && item.isInstalled);
			const unsupported = recommendations.filter((item) => !item.recommendedDriverId);
			appendSupportedDriverSection(translateSetting('settings.driverSupportNotAdded', 'Supported but not added to Homey'), supportedNotInstalled, 'driver-support-not-installed');
			appendSupportedDriverSection(translateSetting('settings.driverSupportAdded', 'Supported and already added to Homey'), supportedInstalled, 'driver-support-installed');

			const unsupportedSection = createDriverSupportSection(translateSetting('settings.driverSupportUnsupportedDevices', 'Unsupported devices'), unsupported, 'driver-support-unsupported');
			const unsupportedList = document.createElement('ul');
			unsupportedList.className = 'driver-support-list';
			unsupported.forEach((device) => {
				const item = document.createElement('li');
				item.textContent = `${device.label} (${device.deviceType || translateSetting('settings.unknownType', 'Unknown type')})`;
				unsupportedList.appendChild(item);
			});
			unsupportedSection.appendChild(unsupportedList);
			if (unsupported.length > 0)
			{
				unsupportedSection.classList.add('driver-support-clickable');
				unsupportedSection.title = translateSetting('settings.driverSupportSendTitle', 'Click to send unsupported device information to the developer');
				unsupportedSection.addEventListener('click', function ()
				{
					Homey.confirm(translateSetting('settings.confirmSendUnsupported', 'Send information about these unsupported devices to the developer?'), null, function (err, confirmed)
					{
						if (err || !confirmed) return;
						waitCursor(true);
						Homey.api('POST', '/SendUnsupportedDevices/', { unsupportedDevices: unsupported }, function (apiErr)
						{
							waitCursor(false);
							Homey.alert(apiErr || translateSetting('settings.logSentSuccessfully', 'Log sent successfully'));
						});
					});
				});
			}
			driverSupportViewElement.appendChild(unsupportedSection);

			const notSupportableDevices = Array.isArray(result.notSupportableDevices) ? result.notSupportableDevices : [];
			appendNotSupportableSection(notSupportableDevices);
		}

		function compareBLEStatisticsRows(left, right, key, direction)
		{
			const factor = direction === 'desc' ? -1 : 1;
			if (key === 'name' || key === 'mac' || key === 'driverType')
			{
				const leftText = String((left && left[key]) || '').toLowerCase();
				const rightText = String((right && right[key]) || '').toLowerCase();
				return leftText.localeCompare(rightText) * factor;
			}

			const leftValue = Number((left && left[key]) || 0);
			const rightValue = Number((right && right[key]) || 0);
			if (leftValue === rightValue)
			{
				const leftName = String((left && left.name) || '').toLowerCase();
				const rightName = String((right && right.name) || '').toLowerCase();
				return leftName.localeCompare(rightName);
			}

			return (leftValue - rightValue) * factor;
		}

		function updateBLEStatisticsSortIndicators()
		{

				? bleStatisticsTableElement.querySelectorAll('thead th.sortable[data-sort-key]')

				const sortKey = header.getAttribute('data-sort-key');
				const baseLabel = header.getAttribute('data-base-label') || header.textContent.replace(/\s*[▲▼]$/, '');
				header.setAttribute('data-base-label', baseLabel);
				if (sortKey === bleStatisticsSort.key)
				{
					header.textContent = `${baseLabel} ${bleStatisticsSort.direction === 'asc' ? '▲' : '▼'}`;
				}
				else
				{
					header.textContent = baseLabel;
				}
			});
		}

			}
			else
			{
				bleStatisticsSort.key = sortKey;
				bleStatisticsSort.direction = 'asc';
			}

			updateBLEStatisticsSortIndicators();
			refreshBLEStatistics();
		}

		function getBLEStatisticsClipboardText()
		{
			const rows = [];
			rows.push([
				translateSetting('settings.device', 'Device'),
				translateSetting('settings.mac', 'MAC'),
				translateSetting('settings.driver', 'Driver'),
				translateSetting('settings.missing', 'Missing'),
				translateSetting('settings.present', 'Present'),
				translateSetting('settings.advertisements', 'Advertisements'),
				translateSetting('settings.polled', 'Polled'),
				translateSetting('settings.rssiDbm', 'RSSI (dBm)'),
				translateSetting('settings.lastSeenElapsed', 'Last Seen (HH:MM:SS ago)'),
			].join('\t'));

			const tbody = bleStatisticsTableElement && bleStatisticsTableElement.querySelector('tbody');
			if (!tbody)
			{
				return rows.join('\n');
			}

			const bodyRows = Array.from(tbody.querySelectorAll('tr'));
			for (const row of bodyRows)
			{
				const cells = Array.from(row.querySelectorAll('td'));
				if (cells.length < 9)
				{
					continue;
				}

				const values = cells.map((cell) => cell.textContent.replace(/\s+/g, ' ').trim());
				if (values[0] === translateSetting('settings.noBleDevices', 'No BLE devices registered.'))
				{
					continue;
				}

				rows.push(values.join('\t'));
			}

			return rows.join('\n');
		}

		async function copyBLEStatisticsToClipboard()
		{
			const text = getBLEStatisticsClipboardText();
			try
			{
				if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function')
				{
					await navigator.clipboard.writeText(text);
				}
				else
				{
					throw new Error('Clipboard API unavailable');
				}

				if (homeyInstance)
				{
					homeyInstance.alert(translateSetting('settings.statisticsCopied', 'Statistics table copied to clipboard.'));
				}
			}
			catch (err)
			{
				const fallbackArea = document.createElement('textarea');
				fallbackArea.value = text;
				fallbackArea.setAttribute('readonly', 'readonly');
				fallbackArea.style.position = 'fixed';
				fallbackArea.style.top = '-1000px';
				document.body.appendChild(fallbackArea);
				fallbackArea.select();
				fallbackArea.setSelectionRange(0, fallbackArea.value.length);

				const copied = document.execCommand('copy');
				document.body.removeChild(fallbackArea);

				if (homeyInstance)
				{
					homeyInstance.alert(copied
						? translateSetting('settings.statisticsCopied', 'Statistics table copied to clipboard.')
						: translateSetting('settings.statisticsCopyFailed', 'Could not copy automatically. Please select and copy the table manually.'));
				}
			}
		}

		function renderBLEStatistics(rows)
		{
			const formatElapsedSince = (lastSeenAt) => {
				const timestamp = Number(lastSeenAt || 0);
				if (!timestamp)
				{
					return translateSetting('settings.never', 'Never');
				}

				const elapsedSeconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
				const hours = Math.floor(elapsedSeconds / 3600);
				const minutes = Math.floor((elapsedSeconds % 3600) / 60);
				const seconds = elapsedSeconds % 60;
				return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
			};

			const tbody = bleStatisticsTableElement && bleStatisticsTableElement.querySelector('tbody');
			if (!tbody)
			{
				return;
			}

			if (!Array.isArray(rows) || rows.length === 0)
			{
				tbody.innerHTML = `<tr><td colspan="9" style="padding:8px;">${translateSetting('settings.noBleDevices', 'No BLE devices registered.')}</td></tr>`;
				return;
			}

			const sortedRows = rows
				.slice()
				.sort((left, right) => compareBLEStatisticsRows(left, right, bleStatisticsSort.key, bleStatisticsSort.direction));

			tbody.innerHTML = sortedRows.map((row) => {
				const lastSeenText = formatElapsedSince(row.lastSeenAt);
				const rssiText = (typeof row.rssi === 'number' && Number.isFinite(row.rssi)) ? String(Math.round(row.rssi)) : '-';
				const macText = (row.mac || '').replace(/[<>]/g, '');
				const driverText = (row.driverType || '').replace(/[<>]/g, '');
				return `
					<tr>
						<td style="padding:6px 8px;">${(row.name || translateSetting('settings.unknown', 'Unknown')).replace(/[<>]/g, '')}</td>
						<td style="padding:6px 8px;">${macText}</td>
						<td style="padding:6px 8px;">${driverText}</td>
						<td style="padding:6px 8px; text-align:right;">${Number(row.missing || 0)}</td>
						<td style="padding:6px 8px; text-align:right;">${Number(row.present || 0)}</td>
						<td style="padding:6px 8px; text-align:right;">${Number(row.advertisements || 0)}</td>
						<td style="padding:6px 8px; text-align:right;">${Number(row.polls || 0)}</td>
						<td style="padding:6px 8px; text-align:right;">${rssiText}</td>
						<td style="padding:6px 8px; text-align:left;">${lastSeenText}</td>
					</tr>
				`;
			}).join('');
		}

				? (logFilterOptions.bySource[logSourceElement.value] || {})

			));

				logFilterValueElement.appendChild(option);

				logFilterValueElement.disabled = true;

			{

		function loadLogSettings(callback)
		{
			Homey.api('GET', '/getLogFilterOptions/', {}, function (optionsErr, options)
			{
				if (optionsErr)
				{
					Homey.alert(optionsErr);
					return;
				}
				logFilterOptions = options || {};

				Homey.get('logLevel', function (levelErr, logLevel)
				{
					if (levelErr) return Homey.alert(levelErr);
					logLevelElement.value = String(logLevel === null ? 0 : logLevel);
					Homey.get('logSource', function (sourceErr, logSource)
					{
						if (sourceErr) return Homey.alert(sourceErr);
						logSourceElement.value = logSource || 'all';
						Homey.get('logFilterType', function (typeErr, filterType)
						{
							if (typeErr) return Homey.alert(typeErr);
							logFilterTypeElement.value = filterType || 'none';
							Homey.get('logFilterValue', function (valueErr, filterValue)
							{
								if (valueErr) return Homey.alert(valueErr);
								populateLogFilterValues(filterValue || '');
								updateLogSettingsSummary();
								if (callback) callback();
							});
						});
					});
				});
			});
		}

		function closeLogSettings()
		{
			logSettingsModalElement.classList.remove('open');
			openLogSettingsElement.focus();
		}

		function saveLogSettings()
		{
			if (logFilterTypeElement.value !== 'none' && !logFilterValueElement.value)
			{
				Homey.alert(translateSetting('settings.selectFilterInformation', 'Select filter information before saving.'));
				return;
			}

			const settings = [
				['logLevel', parseInt(logLevelElement.value)],
				['logSource', logSourceElement.value],
				['logFilterType', logFilterTypeElement.value],
				['logFilterValue', logFilterTypeElement.value === 'none' ? '' : logFilterValueElement.value],
			];
			let pending = settings.length;
			for (const [key, value] of settings)
			{
				Homey.set(key, value, function (err)
				{
					if (err)
					{
						Homey.alert(err);
						return;
					}
					pending--;
					if (pending === 0)
					{
						updateLogSettingsSummary();
						closeLogSettings();
					}
				});
			}
		}

		// a method named 'onHomeyReady' must be present in your code
		function onHomeyReady(Homey)
		{
			homeyInstance = Homey;
			const t = (key, fallback) => {
				const value = Homey.__(key);
				return value === key ? fallback : value;
			};

			const localizeA11yPlaceholders = () => {
				document.querySelectorAll('[title^="settings."]').forEach((element) => {
					const key = element.getAttribute('title');
					element.setAttribute('title', t(key, key));
				});

				document.querySelectorAll('[aria-label^="settings."]').forEach((element) => {
					const key = element.getAttribute('aria-label');
					element.setAttribute('aria-label', t(key, key));
				});
			};

			// Tell Homey we're ready to be displayed
			Homey.ready();
			initializeBLEStatisticsSorting();

			// Ensure placeholder accessibility labels are localized at runtime.
			localizeA11yPlaceholders();

			// Check OAuth status
			checkOAuthStatus(Homey);

			Homey.get('debugMode', function (err, debugMode)
			{
				if (err) return Homey.alert(err);
				document.getElementById('simLogTab').classList.toggle('sim-log-tab-debug', debugMode === true);
			});

			document.getElementById("defaultOpen").click();
			refreshBLEStatistics();
			if (bleStatisticsRefreshTimer)
			{
				clearInterval(bleStatisticsRefreshTimer);
			}
			bleStatisticsRefreshTimer = setInterval(refreshBLEStatistics, 10000);

			if (copyBLEStatisticsElement)
			{
				copyBLEStatisticsElement.addEventListener('click', function ()
				{
					copyBLEStatisticsToClipboard();
				});
			}

			if (clearBLEStatisticsElement)
			{
				clearBLEStatisticsElement.addEventListener('click', function ()
				{
					clearBLEStatistics();
				});
			}

			Homey.api('GET', '/getLog/',
				{
					notify: true
				}, function (err, result)
			{
				if (err)
				{
					Homey.alert(err);
				}
				else
				{
					infoLogElement.value = result;
				}
			});

			Homey.on('com.switchbot.logupdated', function (data)
			{
				infoLogElement.value = data.log;
			});

			Homey.on('com.switchbot.detectedDevicesUpdated', function (data)
			{
				detectedDevicesElement.value = data.devices;
			});

			loadLogSettings();

			Homey.get('numConnections', function (err, numConnections)
			{
				if (err) return Homey.alert(err);
				numConnectionsElement.value = numConnections;
			});

			logFilterTypeElement.addEventListener('change', function ()
			{
				populateLogFilterValues('');
			});

			logSourceElement.addEventListener('change', function ()
			{
				populateLogFilterValues(logFilterValueElement.value);
			});

			openLogSettingsElement.addEventListener('click', function ()
			{
				loadLogSettings(function ()
				{
					logSettingsModalElement.classList.add('open');
					logLevelElement.focus();
				});
			});

			cancelLogSettingsElement.addEventListener('click', closeLogSettings);
			saveLogSettingsElement.addEventListener('click', saveLogSettings);
			logSettingsModalElement.addEventListener('click', function (event)
			{
				if (event.target === logSettingsModalElement)
				{
					closeLogSettings();
				}
			});
			document.addEventListener('keydown', function (event)
			{
				if (event.key === 'Escape' && logSettingsModalElement.classList.contains('open'))
				{
					closeLogSettings();
				}
			});

			loginWithOAuthElement.addEventListener('click', function (e)
			{
				waitCursor(true);
				Homey.api('GET', '/startOAuth2Flow/', {}, function (err, result)
				{
					waitCursor(false);

					if (err || !result || !result.authUrl)
					{
						Homey.alert(t('settings.oauthLoginStartError', 'Error initiating login. Please try again. If this persists, check your OAuth2 client configuration.'));
						return;
					}

					// Use Homey.openURL to open the OAuth callback URL in the actual browser (outside settings webview)
					Homey.openURL(result.authUrl);

					// After user completes OAuth, check status periodically
					Homey.alert(t('settings.oauthLoginOpened', 'A browser window has opened with the SwitchBot login page. After login, return here. The Get HUB devices button will be available once authenticated.'));

					// Give user time to complete OAuth, then start checking
					setTimeout(() => {
						checkOAuthStatus(Homey);
					}, 3000);

					// Keep checking every 5 seconds for up to 5 minutes
					const maxAttempts = 60;
					let attempts = 0;
					const checkInterval = setInterval(() => {
						attempts++;
						if (attempts >= maxAttempts)
						{
							clearInterval(checkInterval);
							return;
						}
						checkOAuthStatus(Homey);
					}, 5000);
				});
			});

			globalAuthLoginElement.addEventListener('click', function ()
			{
				loginWithOAuthElement.click();
			});

			globalAuthLegacyElement.addEventListener('click', function ()
			{
				document.getElementById('oldSettingsTab').click();
			});

			getDeviceLogElement.addEventListener('click', function (e)
			{
				// Check OAuth status first
				Homey.api('GET', '/checkOAuthStatus/', {}, function (err, result)
				{
					if (err || (result && !result.hasOAuthSession))
					{
						Homey.alert(t('settings.oauthLoginRequiredFirst', 'Please log in with your SwitchBot account first by clicking the Login with SwitchBot Account button.'));
						oAuthStatusMessageElement.style.display = 'block';
						loginWithOAuthElement.style.display = 'block';
						return;
					}

					waitCursor(true);
					Homey.api('GET', '/getDetect/',
						{
							notify: true,
							hubDevices: true
						}, function (err, result)
					{
						if (err)
						{
							Homey.alert(err);
						}
						else
						{
							detectedDevicesElement.value = result;
						}
						waitCursor(false);
					});
				});
			});

			clearDeviceLogElement.addEventListener('click', function (e)
			{
				Homey.set('detectedDevices', "", function (err)
				{
					if (err) return Homey.alert(err);
				});
				detectedDevicesElement.value = "";
			});

			sendDeviceLogElement.addEventListener('click', function (e)
			{
				if (detectedDevicesElement.value.length < 15)
				{
					return Homey.alert(t('settings.noDataToSend', 'No Data to send'));
				}
				Homey.confirm(t('settings.confirmSendDeviceLog', 'Send the device log contents to the developer?'), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/SendDeviceLog/',
							{
								notify: true
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert(t('settings.logSentSuccessfully', 'Log sent successfully'));
							}
							waitCursor(false);
						});
					}
				});
			});

			sendInfoLogElement.addEventListener('click', function (e)
			{
				if (infoLogElement.value.length < 15)
				{
					return Homey.alert(t('settings.noDataToSend', 'No Data to send'));
				}

				Homey.confirm(t('settings.confirmSendInfoLog', 'Send the information log contents to the developer?'), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/sendInfoLog/',
							{
								notify: true
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert(t('settings.logSentSuccessfully', 'Log sent successfully'));
							}
							waitCursor(false);
						});
					}
				});
			});

			clearInfoLogElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/clearLog/',
					{
						notify: true
					}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						infoLogElement.value = "";
					}
				});
			});

			useSimElement.addEventListener('click', function (e)
			{
				try
				{
					Homey.set('simData', simDataElement.value, function (err)
					{
						if (err)
						{
							Homey.alert(err);
						}
						else
						{
							Homey.alert(t('settings.simulatorOn', 'Simulator On'));
						}
					});
				}
				catch (err)
				{
					return Homey.alert(err);
				}
			});

			clearSimElement.addEventListener('click', function (e)
			{
				Homey.set('simData', "", function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						return Homey.alert(t('settings.simulatorOff', 'Simulator Off'));
					}
				});
			});

			readStatusElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/requestDeviceStatus/?deviceId=' + deviceIDElement.value, {}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						statusDataElement.value = result;
					}
				});
			});

			clearStatusLogElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/clearStatusLog/',
					{
						notify: true
					}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						statusDataElement.value = "";
					}
				});
			});

			sendStatusLogElement.addEventListener('click', function (e)
			{
				if (statusDataElement.value.length < 15)
				{
					return Homey.alert(t('settings.noDataToSend', 'No Data to send'));
				}

				Homey.confirm(t('settings.confirmSendStatusLog', 'Send the status log contents to the developer?'), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/sendStatusLog/',
							{
								notify: true
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert(t('settings.logSentSuccessfully', 'Log sent successfully'));
							}
							waitCursor(false);
						});
					}
				});
			});

			saveSettingsElement.addEventListener('click', function (e)
			{
				Homey.set('openToken', openTokenIDElement.value, function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
				});

				Homey.set('openSecret', openSecretElement.value, function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
				});

				setTimeout(function ()
				{
					checkOAuthStatus(Homey);
				}, 100);
			});

			saveAppSettingsElement.addEventListener('click', function (e)
			{
				Homey.set('numConnections', parseInt(numConnectionsElement.value), function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
				});
			});
		}

		function setPage(evt, tabPage)
		{
			var i, tabcontent, tablinks;

			// Get all elements with class="tabcontent" and hide them
			tabcontent = document.getElementsByClassName("tabcontent");
			for (i = 0; i < tabcontent.length; i++)
			{
				tabcontent[i].style.display = "none";
			}

			// Get all elements with class="tablinks" and remove the class "active"
			tablinks = document.getElementsByClassName("tablinks");
			for (i = 0; i < tablinks.length; i++)
			{
				tablinks[i].className = tablinks[i].className.replace(" active", "");
			}

			// Show the current tab, and add an "active" class to the button that opened the tab
			document.getElementById(tabPage).style.display = "block";
			evt.currentTarget.className += " active";

			if (tabPage == 'log')
			{
				loadLogSettings();

				// Make the log text area fill the page
				infoLogElement.style.width = infoLogElement.parentElement.clientWidth + 'px';
				infoLogElement.style.height = (window.innerHeight - infoLogElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'detected')
			{
				// Make the detected devices text area fill the page
				detectedDevicesElement.setAttribute('cols', detectedDevicesElement.parentElement.clientWidth / 8);
				detectedDevicesElement.style.height = (window.innerHeight - detectedDevicesElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'simulator')
			{
				Homey.get('simData', function (err, simData)
				{
					if (err) return Homey.alert(err);
					simDataElement.value = simData ? simData : "";
				});
				// Make the simulator text box fill the page
				simDataElement.setAttribute('cols', simDataElement.parentElement.clientWidth / 8);
				simDataElement.style.height = (window.innerHeight - simDataElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'status')
			{
				// Make the detected devices text area fill the page
				statusDataElement.style.width = (deviceIDElement.offsetWidth) + 'px';
				statusDataElement.style.height = (window.innerHeight - statusDataElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'oldSettings')
			{
				Homey.get('openToken', function (err, openToken)
				{
					if (err) return Homey.alert(err);
					openTokenIDElement.value = openToken;
				});

				Homey.get('openSecret', function (err, openSecret)
				{
					if (err) return Homey.alert(err);
					openSecretElement.value = openSecret;
				});
			}
			else if (tabPage == 'appSettings')
			{
				Homey.get('numConnections', function (err, numConnections)
				{
					if (err) return Homey.alert(err);
					numConnectionsElement.value = numConnections;
				});
			}
			else if (tabPage == 'statistics')
			{
				refreshBLEStatistics();
			}
			else if (tabPage == 'driverSupport')
			{
				refreshDriverSupport();
			}
		}

		function waitCursor(On)
		{
			if (On)
			{
				busyi.show();
			}
			else
			{
				busyi.hide();
			}
		}
	</script>
